    textAlign(CENTER, CENTER);

    if (t.label === "<") {
      fill(textoSecundario); textSize(42);
      text("←", t.x + t.w/2, t.y + t.h/2);
    } else if (t.label === "C") {
      fill(textoSecundario); textSize(28);
      text("LIMPIAR", t.x + t.w/2, t.y + t.h/2);
    } else {
      fill(texto); textSize(40);
      text(t.label, t.x + t.w/2, t.y + t.h/2);
    }

    textAlign(LEFT, CENTER);
  }
}

function enRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

function escribirDigito(d) {
  if (activeBoxIndex < 0) return;
  const c = cajas[activeBoxIndex];
  if (c.text.length < 4) c.text += d;
}

function borrarUltimo() {
  if (activeBoxIndex < 0) return;
  cajas[activeBoxIndex].text = cajas[activeBoxIndex].text.slice(0, -1);
}

function limpiarCampo() {
  if (activeBoxIndex < 0) return;
  cajas[activeBoxIndex].text = "";
}

function siguienteCampo() {
  if (activeBoxIndex < cajas.length - 1) cajas[activeBoxIndex + 1].activate();
  else cerrarTeclado();
}

function pressTeclado(mx, my, myLienzo) {

  if (botonCerrarTeclado.isOver(mx, my)) { cerrarTeclado(); return; }
  if (botonSiguiente.isOver(mx, my))     { siguienteCampo(); return; }

  for (const t of teclas) {
    if (enRect(mx, my, t)) {
      if (t.label === "C") limpiarCampo();
      else if (t.label === "<") borrarUltimo();
      else escribirDigito(t.label);
      return;
    }
  }

  // Arriba del teclado: si toco otra casilla, me paso a esa
  if (my < TEC_Y) {
    for (const c of cajas) if (c.isOver(mx, myLienzo)) { c.activate(); return; }
    cerrarTeclado();
  }
}

// ============================================================
// CALCULOS
// ============================================================

function leer(caja) {
  let v = parseInt(caja.getText(), 10);
  if (!Number.isFinite(v) || v < 0) v = 0;
  return v;
}

function reiniciarResultados() {
  vendidos = new Array(N + 1).fill(0);
  fresasChicas = 0;
  fresasGrandes = 0;
  totalPostres = 0;
  ventaTotal = 0;
  costoProduccion = 0;
  comisionEmpleado = 0;
  cantidadMayor = 0;
  postreMasVendido = "-";
}

// Resumen a partir del conteo (inventario - lo que quedo)
function calcularResultados() {

  reiniciarResultados();

  for (let i = 0; i < N; i++) {

    const inventario = leer(cajas[i * 2]);
    const restante   = leer(cajas[i * 2 + 1]);

    // Vendidos = con los que abrio - los que quedaron
    let v = inventario - restante;
    if (v < 0) v = 0;   // por si se captura mal

    vendidos[i] = v;

    totalPostres    += v;
    ventaTotal      += v * precios[i];
    costoProduccion += v * costos[i];
  }

  subtituloResumen = "Conteo, venta y ganancia";
  terminarCalculo(1);
  fechaRegistro = fechaPorDefecto();
}

// Resumen a partir de las ordenes del Punto de Venta
function calcularDesdePV() {

  asegurarDia();
  reiniciarResultados();

  // Solo las ordenes despues del ultimo reinicio (↺), igual que la barra y el historial.
  // Las de ayer se usan solo si hoy no hubo ninguna venta NI reinicio (por si no alcanzaste a cerrar).
  let fuente = { fecha: pv.fecha, ordenes: pv.ordenes.filter(o => o.n > (pv.corte || 0)) };
  const hoySinNada = pv.ordenes.length === 0 && !pv.corte;
  const deAyer = hoySinNada && pv.anterior && pv.anterior.ordenes.length;
  if (deAyer) fuente = pv.anterior;

  for (const o of fuente.ordenes) {
    for (const it of o.items) {
      const idx = it.prod === "fresas" ? N : it.prod;
      vendidos[idx]++;
      if (it.prod === "fresas") {
        if (it.tam === "grandes") fresasGrandes++; else fresasChicas++;
      }
      totalPostres++;
      ventaTotal      += precioItem(it);
      costoProduccion += costoItem(it);
    }
  }

  const fecha = fechaDesdeIso(fuente.fecha);
  subtituloResumen = (deAyer ? "Sin cerrar del " + textoFecha(fecha).slice(0, -5) + " · "
                             : "Punto de Venta · ") +
                     fuente.ordenes.length + (fuente.ordenes.length === 1 ? " orden" : " órdenes");
  terminarCalculo(3);
  fechaRegistro = fecha;
}

function terminarCalculo(origen) {

  for (let i = 0; i <= N; i++) {
    if (vendidos[i] > cantidadMayor) {
      cantidadMayor = vendidos[i];
      postreMasVendido = NOMBRES_RESUMEN[i];
    }
  }

  gastosBase = costoProduccion + RENTA + LUZ + GAS;

  comisionEmpleado = ventaTotal * COMISION_EMPLEADO;
  totalGastos = gastosBase + comisionEmpleado;

  // El AHORRO no se resta: queda dentro del profit
  profitLibre       = ventaTotal - totalGastos;   // pagando al empleado
  profitSinEmpleado = ventaTotal - gastosBase;    // si vendiste tu

  // Cada calculo nuevo se puede volver a registrar
  estadoRegistro = "listo";
  origenResumen = origen;

  pantalla = 2;
  cerrarTeclado();
}

// ============================================================
// NAVEGACION
// ============================================================

function cerrarTeclado() {
  for (const c of cajas) c.active = false;
  activeBoxIndex = -1;
}

function irAInicio()  { pantalla = 0; cerrarTeclado(); modalFresas = null; pinDueno = null; }
function irAEstadisticas() { pantalla = 5; est.sel = null; cargarEstadisticas(); }
function irACaptura() { pantalla = 1; cerrarTeclado(); confirmarBorrar = SIN_CONFIRMAR; }
function irAPV()      {
  asegurarDia(); pantalla = 3; modalFresas = null; confirmarVaciar = SIN_CONFIRMAR;
  sincronizar(false);   // trae el stock actualizado del Sheet
}

// ============================================================
// MOUSE / TOUCH
// ============================================================





function handlePress(mxRaw, myRaw) {

  // Todo el dibujo esta desplazado OFFSET_Y hacia abajo
  const mx = mxRaw;
  const my = myRaw - OFFSET_Y;

  const ov = overlayActual();
  if (ov) { ov.press(mx, my - dyOverlay, my); return; }

  if (pantalla === 0) {

    if (botonInicio.isOver(mx, my))          entrarDueno("dueno");
    else if (botonPV.isOver(mx, my))         irAPV();
    else if (botonEst.isOver(mx, my))        entrarDueno("estad");
    else if (botonRec.isOver(mx, my))        entrarDueno("recetas");
    else if (botonCierrePV.isOver(mx, my))   calcularDesdePV();

  } else if (pantalla === 1) {

    if (botonAtras.isOver(mx, my)) { irAInicio(); return; }
    if (enRect(mx, my, botonBorrar)) { pressBorrarTodo(); return; }

    for (const c of cajas) c.pressedAt(mx, my);

    if (botonCalcular.isOver(mx, my)) calcularResultados();

  } else if (pantalla === 2) {

    if (botonAtras.isOver(mx, my)) {
      if (origenResumen === 3) irAPV(); else irACaptura();
      return;
    }
    if (botonRegistrar.isOver(mx, my))  { registrar();     return; }
    if (botonDiaAntes.isOver(mx, my))   { moverFecha(-1);  return; }
    if (botonDiaDespues.isOver(mx, my)) { moverFecha(1);   return; }

  } else if (pantalla === 3) {

    if (modalFresas) pressModalFresas(mx, my);
    else             pressPV(mx, my);

  } else if (pantalla === 4) {

    pressOrden(mx, my);

  } else if (pantalla === 5) {

    pressEstadisticas(mx, my);

  } else if (pantalla === 6) {

    pressRecetas(mx, my);

  } else {

    pressHistorial(mx, my);
  }
}

// ============================================================
// TECLADO FISICO
// ============================================================

function keyPressed() {

  if (pinDueno !== null) {
    if (key >= '0' && key <= '9')                 escribirPin(key);
    else if (keyCode === BACKSPACE)               pinDueno = pinDueno.slice(0, -1);
    else if (keyCode === ENTER || keyCode === RETURN) verificarPinDueno();
    else if (keyCode === ESCAPE)                  pinDueno = null;
    return false;
  }

  if (pantalla !== 1) return;

  if (tecladoAbierto()) {
    if (key >= '0' && key <= '9') { escribirDigito(key); return false; }
    if (keyCode === BACKSPACE)    { borrarUltimo();      return false; }
    if (keyCode === DELETE)       { limpiarCampo();      return false; }
    if (keyCode === TAB)          { siguienteCampo();    return false; }
    if (keyCode === ESCAPE)       { cerrarTeclado();     return false; }
    if (keyCode === ENTER || keyCode === RETURN) {
      if (activeBoxIndex < cajas.length - 1) siguienteCampo();
      else { cerrarTeclado(); calcularResultados(); }
      return false;
    }
    return false;
  }

  if (keyCode === ENTER || keyCode === RETURN) calcularResultados();
}

// ============================================================
// FORMATO
// ============================================================

function formato(numero) { return nf(numero, 0, 2); }

// Recorta un texto para que quepa en un ancho (usa el textSize actual)
function recortar(s, maxW) {
  if (textWidth(s) <= maxW) return s;
  while (s.length > 1 && textWidth(s + "…") > maxW) s = s.slice(0, -1);
  return s + "…";
}

// Parte un texto en renglones que quepan en un ancho (usa el textSize actual)
function partirTexto(s, maxW) {
  const palabras = s.split(" ");
  const out = [];
  let actual = "";
  for (const p of palabras) {
    const prueba = actual ? actual + " " + p : p;
    if (textWidth(prueba) > maxW && actual) { out.push(actual); actual = p; }
    else actual = prueba;
  }
  if (actual) out.push(actual);
  return out;
}

// ============================================================
// TEXTBOX
// ============================================================

class TextBox {

  constructor(x, y, w, h, producto, tipo) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.producto = producto;
    this.tipo = tipo;          // "inv" o "uni"
    this.text = "";
    this.active = false;
  }

  get indice() { return cajas.indexOf(this); }

  display() {
    if (this.active) { fill('#F0F6F2'); stroke(verde); strokeWeight(3); }
    else             { fill('#F7F8F7'); stroke(borde); strokeWeight(2); }

    rect(this.x, this.y, this.w, this.h, 18);

    textAlign(CENTER, CENTER);
    textSize(34);

    if (this.text === "") { fill('#A5AAA5'); text("0", this.x + this.w/2, this.y + this.h/2); }
    else                  { fill(texto);     text(this.text, this.x + this.w/2, this.y + this.h/2); }

    textAlign(LEFT, CENTER);
    noStroke();
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  pressedAt(mx, my) {
    if (this.isOver(mx, my)) this.activate();
    else if (this.active) this.active = false;
  }

  activate() {
    for (const c of cajas) c.active = false;
    this.active = true;
    activeBoxIndex = this.indice;
    cajaPorMostrar = this;
  }

  getText() { return this.text; }
}

// ============================================================
// BUTTON
// ============================================================

class Button {

  constructor(x, y, w, h, label, fontSize) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.fontSize = fontSize || 26;
  }

  display() {
    let hover = this.isOver(mouseX, mouseY - OFFSET_Y);

    noStroke();
    fill(0, 20);
    rect(this.x, this.y + 6, this.w, this.h, 20);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 20);

    fill(blanco);
    textAlign(CENTER, CENTER);
    textSize(this.fontSize);
    text(this.label, this.x + this.w/2, this.y + this.h/2);
    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}

// ============================================================
// BIGBUTTON
// ============================================================

class BigButton {

  constructor(x, y, w, h, label, sublabel, base, hover, letraOscura) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.sublabel = sublabel;
    this.base = base;
    this.hover = hover;
    this.oscura = letraOscura || null;   // color de letra para fondos claros (amarillo)
  }

  display() {
    let hover = this.isOver(mouseX, mouseY - OFFSET_Y);

    noStroke();
    fill(0, 22);
    rect(this.x, this.y + 7, this.w, this.h, 28);

    fill(hover ? this.hover : this.base);
    rect(this.x, this.y, this.w, this.h, 28);

    const osc = this.oscura;
    if (osc) fill(red(osc), green(osc), blue(osc), 150); else fill(255, 150);
    textAlign(RIGHT, CENTER);
    textSize(38);
    text("→", this.x + this.w - 42, this.y + this.h/2);

    fill(osc ? osc : blanco);
    textAlign(LEFT, CENTER);
    textSize(44);
    text(this.label, this.x + 45, this.y + this.h/2 - 24);

    if (osc) fill(red(osc), green(osc), blue(osc), 200); else fill(255, 190);
    textSize(26);
    text(this.sublabel, this.x + 45, this.y + this.h/2 + 32);

    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}
