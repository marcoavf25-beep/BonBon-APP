<meta name="theme-color" content="#C20034">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #F5F6F4;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    /* La app empieza debajo de la hora y la camara */
    padding-top: env(safe-area-inset-top);
    overscroll-behavior-y: none;
  }
  #sketch-holder { line-height: 0; display: flex; justify-content: center; }
  #sketch-holder canvas { display: block; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }

  /* Tapa la zona de la hora cuando la pantalla se desliza */
  #tapa {
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: #F5F6F4; z-index: 5;
  }

  /* Barra de comision: siempre visible abajo */
  #barra {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(245,246,244,0), #F5F6F4 30%);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  #barra .caja {
    max-width: 532px; margin: 0 auto;
    background: #252925; color: #fff;
    border-radius: 16px; padding: 7px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
  }
  #barra .etq { font-size: 11px; letter-spacing: .4px; opacity: .6; }
  #barra .val { font-size: 21px; font-weight: 700; margin-top: 1px; }
  #barra .com { text-align: right; }
  #reiniciar {
    width: 40px; height: 40px; border-radius: 20px; border: 0;
    background: rgba(255,255,255,.12); color: #fff; font-size: 21px; line-height: 40px;
    padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #reiniciar:active { background: rgba(255,255,255,.25); }
  #barra .com .val { color: #8FD4A8; }

  #sondeo {
    position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
</style>
</head>

function windowResized() { leerZonaSegura(); ajustarLienzo(); }

// Zona de la hora/camara y de la rayita de abajo del iPhone
function leerZonaSegura() {
  const p = document.getElementById('sondeo');
  if (!p) return;
  const cs = getComputedStyle(p);
  zonaSegura = { arriba: parseFloat(cs.paddingTop) || 0, abajo: parseFloat(cs.paddingBottom) || 0 };
}

function medirEscala() {
  escala = Math.min(window.innerWidth, 560) / BASE_W;
}

// El lienzo ocupa todo el ancho; de alto mide lo que necesite la pantalla
function ajustarLienzo() {
  medirEscala();
  const vistaAlto = (window.innerHeight - zonaSegura.arriba - zonaSegura.abajo) / escala;
  const extra = tecladoAbierto() ? (TEC_FIN - TEC_Y) : 0;   // para poder subir la casilla sobre el teclado
  const alto = Math.ceil(Math.max(OFFSET_Y + altoContenido + barraAlto + extra, vistaAlto));
  if (alto !== altoLienzo) { resizeCanvas(BASE_W, alto); altoLienzo = alto; }
  const w = (BASE_W * escala) + "px", h = (altoLienzo * escala) + "px";
  if (lienzo.style.width !== w)  lienzo.style.width = w;
  if (lienzo.style.height !== h) lienzo.style.height = h;
}

// Borde de abajo de lo que se ve en pantalla (en coordenadas del diseño)
function finVisible() {
  const r = lienzo.getBoundingClientRect();
  return (window.innerHeight - zonaSegura.abajo - r.top) / escala - OFFSET_Y;
}

// Si una casilla queda tapada por el teclado, se desliza la pantalla para verla
function asegurarVisible(c) {
  if (!lienzo) return;
  const r = lienzo.getBoundingClientRect();
  const arriba = zonaSegura.arriba + 10;
  const tecladoArriba = window.innerHeight - zonaSegura.abajo - (TEC_FIN - TEC_Y) * escala;
  const yArriba = r.top + (c.y + OFFSET_Y) * escala;
  const yAbajo  = r.top + (c.y + c.h + OFFSET_Y) * escala;
  if (yArriba < arriba || yAbajo > tecladoArriba - 10) {
    const centro = arriba + (tecladoArriba - arriba) / 2;
    window.scrollBy(0, (yArriba + yAbajo) / 2 - centro);
  }
}

// Toques: un toque corto es "picar"; si el dedo se mueve, es deslizar la pantalla
function prepararToques() {
  let toque = null;
  lienzo.addEventListener("pointerdown", e => {
    toque = { x: e.clientX, y: e.clientY };
  });
  lienzo.addEventListener("pointermove", e => {
    if (toque && Math.hypot(e.clientX - toque.x, e.clientY - toque.y) > 12) toque = null;
  });
  lienzo.addEventListener("pointercancel", () => { toque = null; });
  lienzo.addEventListener("pointerup", e => {
    if (!toque) return;
    toque = null;
    const r = lienzo.getBoundingClientRect();
    handlePress((e.clientX - r.left) / escala, (e.clientY - r.top) / escala);
  });
}

// Ventana que esta abierta encima (teclado, PIN o fresas)

  if (pinDueno !== null)              return { fin: PIN_FIN, dibujar: dibujarPinDueno,    press: pressPinDueno };
  if (tecladoAbierto())               return { fin: TEC_FIN, dibujar: dibujarTeclado,     press: pressTeclado };
  if (pantalla === 3 && modalFresas)  return { fin: MF_FIN,  dibujar: dibujarModalFresas, press: pressModalFresas };
  return null;
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(fondo);

  // Al cambiar de pantalla se regresa arriba
  if (pantalla !== pantallaPrevia) { pantallaPrevia = pantalla; window.scrollTo(0, 0); }

  push();
  translate(0, OFFSET_Y);

  if (pantalla === 0)      pantallaInicio();
  else if (pantalla === 1) pantallaCaptura();
  else if (pantalla === 2) pantallaResultados();
  else if (pantalla === 3) pantallaPV();
  else if (pantalla === 4) pantallaOrden();
  else if (pantalla === 5) pantallaEstadisticas();
  else if (pantalla === 6) pantallaRecetas();
  else                     pantallaHistorial();

  // Las ventanas de abajo se pegan al borde de lo que se ve
  const ov = overlayActual();
  if (ov) {
    dyOverlay = finVisible() - ov.fin;
    push();
    translate(0, dyOverlay);
    ov.dibujar();
    pop();
  } else {
    dyOverlay = 0;
  }

  pop();

  // Con una ventana abierta no se desliza la pantalla
  const ta = ov ? "none" : "pan-y";
  if (lienzo.style.touchAction !== ta) lienzo.style.touchAction = ta;

  actualizarBarra(!ov && pantalla !== 2 && pantalla !== 5 && pantalla !== 6);
  ajustarLienzo();

  if (cajaPorMostrar) { asegurarVisible(cajaPorMostrar); cajaPorMostrar = null; }
  if (mantenerOrdenar) { mostrarOrdenar(); mantenerOrdenar = false; }
}

// Si el boton ORDENAR quedo abajo de la barra, se desliza un poco la pantalla
function mostrarOrdenar() {
  if (pantalla !== 3 || modalFresas) return;
  const r = lienzo.getBoundingClientRect();
  const fondoBoton = r.top + (pvOrdenar.y + pvOrdenar.h + OFFSET_Y) * escala;
  const barra = document.getElementById("barra");
  const tapa = barra && barra.style.display !== "none" ? barra.offsetHeight : zonaSegura.abajo;
  const limite = window.innerHeight - tapa - 6;
  if (fondoBoton > limite) window.scrollBy(0, fondoBoton - limite);
}

// Si cierras de madrugada (antes de las 5 am) se propone el dia anterior
function fechaPorDefecto() {
  const d = new Date();
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  d.setHours(12, 0, 0, 0);
  return d;
}

function fechaDesdeIso(s) {
  const p = String(s).split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2], 12, 0, 0, 0);
}

function textoFecha(d) {
  return DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear();
}

function isoFecha(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function moverFecha(n) {
  if (estadoRegistro === "enviando") return;
  const nueva = new Date(fechaRegistro);
  nueva.setDate(nueva.getDate() + n);
  const hoy = new Date();
  hoy.setHours(23, 59, 59, 999);
  if (nueva > hoy) return;               // no se registran dias futuros
  fechaRegistro = nueva;
  estadoRegistro = "listo";
}

function leerPin() {
  try { return localStorage.getItem("bonbon_pin") || ""; } catch (e) { return ""; }
}
function guardarPin(pin) {
  try { localStorage.setItem("bonbon_pin", pin); } catch (e) {}
}
function borrarPin() {
  try { localStorage.removeItem("bonbon_pin"); } catch (e) {}
}

function errorRegistro(msg) {
  estadoRegistro = "error";
  mensajeRegistro = msg;
}

async function registrar() {

  if (estadoRegistro === "enviando") return;

  if (!SCRIPT_URL.startsWith("https://")) { errorRegistro("Falta la URL del script"); return; }
  if (totalPostres === 0)                 { errorRegistro("No hay ventas capturadas"); return; }

  let pin = leerPin();
  if (!pin) {
    pin = (window.prompt("PIN de BON BON (solo se pide una vez):") || "").trim();
    if (!pin) return;
    guardarPin(pin);
  }

  estadoRegistro = "enviando";

  const datos = {
    pin: pin,
    fecha: isoFecha(fechaRegistro),
    ventaTotal: ventaTotal,
    costoPostres: costoProduccion,
    utilidad: ventaTotal - costoProduccion,   // venta - costo de cada postre vendido
    totalPostres: totalPostres,
    comisionEmpleado: comisionEmpleado,
    gastosFijos: RENTA + LUZ + GAS,
    profitLibre: profitLibre,
    profitSinEmpleado: profitSinEmpleado,
    postres: postres.slice(),
    vendidos: vendidos.slice(0, N),
    fresasChicas: fresasChicas,
    fresasGrandes: fresasGrandes
  };

  try {
    // Sin encabezados extra para que Google no bloquee la peticion (CORS)
    const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(datos) });
    const j = await r.json();

    if (j.ok)                    estadoRegistro = j.actualizado ? "actualizado" : "ok";
    else if (j.error === "PIN")  { borrarPin(); errorRegistro("PIN incorrecto"); }
    else                         errorRegistro("Error en el Sheet");

  } catch (e) {
    errorRegistro("Sin conexión, reintenta");
  }
}

// ============================================================
// PUNTO DE VENTA - DATOS
// ============================================================

function diaOperativo() { return isoFecha(fechaPorDefecto()); }

function cargarPV() {
  try {
    const s = JSON.parse(localStorage.getItem(PV_KEY) || "null");
    if (s && s.fecha) {
      pv = Object.assign({ ordenes: [], siguiente: 1, carrito: [], anterior: null,
                           pendientes: [], stock: {} }, s);
    }
  } catch (e) {}
  asegurarDia();
}

function guardarPV() {
  try { localStorage.setItem(PV_KEY, JSON.stringify(pv)); } catch (e) {}
}

// Al empezar un dia nuevo (despues de las 5 am) se empieza de cero.
// Las ordenes del dia anterior se guardan por si no alcanzaste a cerrar.
function asegurarDia() {
  const hoy = diaOperativo();
  if (pv.fecha === hoy) return;
  const quedaron = (pv.ordenes || []).filter(o => o.n > (pv.corte || 0));
  const anterior = quedaron.length
    ? { fecha: pv.fecha, ordenes: quedaron }
    : pv.anterior;
  pv = { fecha: hoy, ordenes: [], siguiente: 1, carrito: [], anterior: anterior || null,
         pendientes: pv.pendientes || [], stock: pv.stock || {}, corte: 0 };
  guardarPV();
}

function cargoToppings(it) {
  if (it.premium.length)  return PRECIO_PREMIUM;
  if (it.clasicos.length) return PRECIO_CLASICOS;
  return 0;
}

function precioItem(it) {
  if (it.prod === "fresas") return FRESAS[it.tam].precio + cargoToppings(it);
  return precios[it.prod];
}

function costoItem(it) {
  if (it.prod !== "fresas") return costos[it.prod];
  let c = FRESAS[it.tam].costo;
  for (const i of it.premium)  c += TOP_PREMIUM[i].costo;
  for (const i of it.clasicos) c += TOP_CLASICOS[i].costo;
  return c;
}

function nombreItem(it) {
  return it.prod === "fresas" ? FRESAS[it.tam].nombre : postres[it.prod];
}

function nombresTop(lista, idxs) {
  return idxs.map(i => lista[i].nombre).join(", ");
}

// Una linea corta para el carrito
function resumenToppings(it) {
  const todos = it.premium.map(i => TOP_PREMIUM[i].nombre)
                 .concat(it.clasicos.map(i => TOP_CLASICOS[i].nombre));
  if (!todos.length) return "Sin toppings";
  return "+$" + cargoToppings(it) + " · " + todos.join(", ");
}

// Detalle completo para la orden final
function detallesItem(it) {
  const out = [];
  if (it.premium.length)
    out.push("Premium: " + nombresTop(TOP_PREMIUM, it.premium) + "  +$" + PRECIO_PREMIUM);
  if (it.clasicos.length)
    out.push("Clásicos: " + nombresTop(TOP_CLASICOS, it.clasicos) +
             (it.premium.length ? "  (incluidos)" : "  +$" + PRECIO_CLASICOS));
  if (!out.length) out.push("Sin toppings");
  return out;
}

// Junta los postres iguales ("2 × Flan"); cada fresa va en su propia linea
function agruparItems(items) {
  const lineas = [];
  const porPostre = {};
  items.forEach((it, k) => {
    if (it.prod === "fresas") {
      lineas.push({ fresas: true, item: it, ref: k, cant: 1, total: precioItem(it) });
    } else if (porPostre[it.prod]) {
      porPostre[it.prod].cant++;
      porPostre[it.prod].total += precioItem(it);
    } else {
      const l = { fresas: false, prod: it.prod, item: it, cant: 1, total: precioItem(it) };
      porPostre[it.prod] = l;
      lineas.push(l);
    }
  });
  return lineas;
}

function totalItems(items) {
  let t = 0;
  for (const it of items) t += precioItem(it);
  return t;
}

// La barra cuenta solo las ordenes despues del ultimo reinicio (pv.corte).
// El cierre del dia sigue usando TODAS las ordenes del dia.
function totalesPV() {
  asegurarDia();
  let venta = 0, n = 0;
  for (const o of pv.ordenes) {
    if (o.n > (pv.corte || 0)) { venta += o.total; n++; }
  }
  return { venta: venta, comision: venta * COMISION_EMPLEADO, ordenes: n };
}

function reiniciarVendido() {
  pv.corte = pv.siguiente - 1;
  pv.anterior = null;          // tampoco se usan las ordenes de ayer en el cierre
  guardarPV();
  barraTexto = "";
  avisar("Vendido hoy reiniciado");
}

function cuentaEnCarrito(i) {
  let n = 0;
  for (const it of pv.carrito) {
    if (i === N ? it.prod === "fresas" : it.prod === i) n++;
  }
  return n;
}

function horaTexto(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, "0");
  const ampm = h >= 12 ? "pm" : "am";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + m + " " + ampm;
}

// ============================================================
// INVENTARIO (pestaña "Inventario" del Sheet)
// ============================================================

// Mismo criterio que el Sheet: sin acentos ni mayusculas
function clave(t) {
  return String(t).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// { "Carlota": 2, "Fresas Chicas": 1, ... }
// Las fresas restan de una sola fila "Fresas": chicas 1, grandes 1.5
function piezasDe(items) {
  const m = {};
  for (const it of items) {
    if (it.prod === "fresas") m["Fresas"] = (m["Fresas"] || 0) + FRESAS[it.tam].porcion;
    else { const k = nombreItem(it); m[k] = (m[k] || 0) + 1; }
  }
  return m;
}

function textoDetalle(items) {
  return agruparItems(items).map(l => {
    let t = (l.cant > 1 ? l.cant + " × " : "") + nombreItem(l.item);
    if (l.fresas) {
      const tops = l.item.premium.map(i => TOP_PREMIUM[i].nombre)
                   .concat(l.item.clasicos.map(i => TOP_CLASICOS[i].nombre));
      if (tops.length) t += " (" + tops.join(", ") + ")";
    }
    return t;
  }).join(", ");
}

// Stock que se sabe en el celular (se corrige con lo que diga el Sheet)
function stockDe(nombre) {
  const v = pv.stock ? pv.stock[clave(nombre)] : undefined;
  return typeof v === "number" ? v : null;
}

// Cuanto de este producto ya va en la orden actual (fresas en porciones)
function enCarritoInv(nombreInv) {
  let n = 0;
  for (const it of pv.carrito) {
    if (it.prod === "fresas") { if (nombreInv === "Fresas") n += FRESAS[it.tam].porcion; }
    else if (postres[it.prod] === nombreInv) n++;
  }
  return n;
}

// Lo que todavia se puede vender (null = ese producto no lleva inventario)
function disponible(nombreInv) {
  const q = stockDe(nombreInv);
  if (q === null) return null;
  return Math.round((q - enCarritoInv(nombreInv)) * 100) / 100;
}

function avisar(t) { aviso = { t: t, hasta: millis() + 2600 }; }

function moverStockLocal(piezas, signo) {
  for (const nombre in piezas) {
    const k = clave(nombre);
    if (typeof pv.stock[k] === "number") pv.stock[k] = Math.round((pv.stock[k] + signo * piezas[nombre]) * 100) / 100;
  }
}

// interactivo = lo pidio una persona (puede preguntar el PIN)
async function sincronizar(interactivo) {
  if (sync.enviando) return;
  if (!SCRIPT_URL.startsWith("https://")) return;

  let pin = leerPin();
  if (!pin) {
    if (!interactivo) { if (pv.pendientes.length) sync.estado = "sinpin"; return; }
    pin = (window.prompt("PIN de registro (solo se pide una vez):") || "").trim();
    if (!pin) { sync.estado = "sinpin"; return; }
    guardarPin(pin);
  }

  sync.enviando = true;
  const ops = pv.pendientes.slice();

  try {
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ pin: pin, accion: "inventario", ops: ops })
    });
    const j = await r.json();

    if (j.ok) {
      const enviados = new Set(ops.map(op => op.tipo + "|" + op.id));
      pv.pendientes = pv.pendientes.filter(op => !enviados.has(op.tipo + "|" + op.id));
      pv.stock = j.stock || {};
      // Lo que se ordeno mientras se enviaba todavia no lo resta el Sheet
      for (const op of pv.pendientes) {
        if (op.tipo === "orden") moverStockLocal(op.piezas, -1);
      }
      guardarPV();
      sync.estado = "ok";
    } else if (j.error === "PIN") {
      borrarPin();
      sync.estado = "pin";
    } else {
      sync.estado = "error";
    }
  } catch (e) {
    sync.estado = "offline";
  }
  sync.enviando = false;
}

function textoEstadoSync() {
  if (millis() < aviso.hasta) return { t: aviso.t, c: rojo };
  const n = pv.pendientes.filter(op => op.tipo === "orden").length;
  if (sync.enviando && pv.pendientes.length) return { t: "Actualizando inventario…", c: textoSecundario };
  if (sync.estado === "pin")    return { t: "PIN incorrecto · toca aquí", c: rojo };
  if (sync.estado === "sinpin") return { t: "Falta el PIN · toca aquí", c: rojo };
  if (pv.pendientes.length && sync.estado === "offline") return { t: "Sin internet · " + n + " por enviar", c: rojo };
  if (pv.pendientes.length && sync.estado === "error")   return { t: "Error en el Sheet · toca aquí", c: rojo };
  if (pv.pendientes.length) return { t: n + " por enviar al inventario", c: textoSecundario };
  return { t: "Toca un postre para agregarlo", c: textoSecundario };
}

function actualizarBarra(visible) {
  const el = document.getElementById("barra");
  if (!el) return;
  if (!visible) {
    if (el.style.display !== "none") el.style.display = "none";
    barraAlto = 0;
    return;
  }
  const t = totalesPV();
  const avisoBarra = millis() < aviso.hasta && aviso.t === "Vendido hoy reiniciado";
  const txt = t.ordenes + "|" + t.venta + "|" + avisoBarra;
  if (txt !== barraTexto) {
    barraTexto = txt;
    el.querySelector(".etq-venta").textContent = avisoBarra ? "✓ REINICIADO" :
      "VENDIDO HOY · " + t.ordenes + (t.ordenes === 1 ? " ORDEN" : " ÓRDENES");
    el.querySelector(".val-venta").textContent = "$" + formato(t.venta);
    el.querySelector(".val-com").textContent = "$" + formato(t.comision);
  }
  if (el.style.display !== "block") el.style.display = "block";
  barraAlto = el.offsetHeight / escala;
}

function dibujarTile(k) {
  const t = tiles[k];
  const i = t.ref;
  if (i < 0) { dibujarTileFuturo(t); return; }
  const esFresas = i === N;
  const bg  = esFresas ? rojo   : color(COLORES_PV[i][0]);
  const acc = esFresas ? blanco : color(COLORES_PV[i][1]);

  noStroke();
  fill(0, 16);
  rect(t.x, t.y + 5, t.w, t.h, 26);
  fill(bg);
  rect(t.x, t.y, t.w, t.h, 26);

  // Rayita de color
  fill(acc);
  rect(t.x + 20, t.y + 22, 38, 9, 5);

  // Nombre
  const lineas = esFresas ? ["Fresas", "con Crema"] : NOMBRES_TILE[i];
  textAlign(LEFT, CENTER);
  textStyle(BOLD);
  textSize(29);
  const y0 = lineas.length === 1 ? t.y + 78 : t.y + 64;
  for (let k = 0; k < lineas.length; k++) text(lineas[k], t.x + 20, y0 + k * 33);
  textStyle(NORMAL);

  // Precio
  const q = disponible(esFresas ? "Fresas" : postres[i]);
  fill(esFresas ? color(255, 225) : acc);
  textSize(26);
  if (esFresas && q !== null && q < FRESAS.chicas.porcion) {
    textStyle(BOLD);
    text("AGOTADAS", t.x + 20, t.y + t.h - 30);
    textStyle(NORMAL);
  } else {
    text(esFresas ? "desde $" + FRESAS.chicas.precio : "$" + precios[i], t.x + 20, t.y + t.h - 30);
  }

  // Cuantos quedan en el refri (segun la pestaña Inventario)
  if (q !== null && !esFresas) {
    textAlign(RIGHT, CENTER);
    textSize(21);
    if (q <= 0) {
      fill(rojo);
      textStyle(BOLD);
      text("AGOTADO", t.x + t.w - 16, t.y + t.h - 30);
      textStyle(NORMAL);
    } else {
      fill(q <= 2 ? rojo : acc);
      text("quedan " + cantidadTexto(q), t.x + t.w - 16, t.y + t.h - 30);
    }
    textAlign(LEFT, CENTER);
  }

  // Cuantos van en esta orden
  const n = cuentaEnCarrito(i);
  if (n > 0) {
    fill(esFresas ? blanco : acc);
    ellipse(t.x + t.w - 34, t.y + 36, 50, 50);
    fill(esFresas ? rojo : bg);
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    textSize(26);
    text(n, t.x + t.w - 34, t.y + 37);
    textStyle(NORMAL);
    textAlign(LEFT, CENTER);
  }

  // Agotado: se ve apagado
  const agotado = q !== null && q < (esFresas ? FRESAS.chicas.porcion : 1);
  if (agotado) {
    fill(245, 246, 244, 150);
    rect(t.x, t.y, t.w, t.h, 26);
  }

  // Destello al tocar (rojo si estaba agotado)
  const dt = millis() - destello[i];
  if (dt < 260) {
    fill(255, 150 * (1 - dt / 260));
    rect(t.x, t.y, t.w, t.h, 26);
  }
  const dr = millis() - destelloRojo[i];
  if (dr < 450) {
    noFill();
    stroke(rojo);
    strokeWeight(5);
    rect(t.x + 2, t.y + 2, t.w - 4, t.h - 4, 24);
    noStroke();
  }
}

// 7.5 -> "7.5", 7 -> "7"
function cantidadTexto(q) {
  return Number.isInteger(q) ? String(q) : q.toFixed(1);
}

function lineasCarrito() {
  const lineas = agruparItems(pv.carrito);
  lineas.forEach((l, k) => {
    l.y = PV_LINEA_Y0 + k * PV_LINEA_H;
    l.menos = { x: 588, y: l.y - 6, w: 66, h: 64 };
  });
  return { visibles: lineas, ocultas: 0 };
}

  }
  return y + alto;
}

function pressPV(mx, my) {

  if (botonAtras.isOver(mx, my)) { irAInicio(); return; }
  if (enRect(mx, my, PV_ESTADO)) { sincronizar(true); return; }

  if (enRect(mx, my, PV_HISTORIAL)) { irAHistorial(); return; }

  for (const t of tiles) {
    if (enRect(mx, my, t)) {
      const i = t.ref;
      if (i < 0) { avisar("Producto próximamente"); return; }
      if (i === N) {
        const d = disponible("Fresas");
        if (d !== null && d < FRESAS.chicas.porcion) {
          avisar("Ya no hay fresas en el refri"); destelloRojo[i] = millis(); return;
        }
        modalFresas = { tam: "chicas", premium: [], clasicos: [] };
      } else {
        const d = disponible(postres[i]);
        if (d !== null && d < 1) {
          avisar(postres[i] + " está agotado"); destelloRojo[i] = millis(); return;
        }
        pv.carrito.push({ prod: i });
        guardarPV();
        destello[i] = millis();
        mantenerOrdenar = true;
      }
      confirmarVaciar = SIN_CONFIRMAR;
      return;
    }
  }

  if (pv.carrito.length && enRect(mx, my, PV_VACIAR)) {
    if (millis() - confirmarVaciar < TIEMPO_CONFIRMAR) {
      pv.carrito = [];
      guardarPV();
      confirmarVaciar = SIN_CONFIRMAR;
    } else {
      confirmarVaciar = millis();
    }
    return;
  }

  const { visibles } = lineasCarrito();
  for (const l of visibles) {
    if (enRect(mx, my, l.menos)) {
      if (l.fresas) {
        pv.carrito.splice(l.ref, 1);
      } else {
        for (let k = pv.carrito.length - 1; k >= 0; k--) {
          if (pv.carrito[k].prod === l.prod) { pv.carrito.splice(k, 1); break; }
        }
      }
      guardarPV();
      return;
    }
  }

  if (pv.carrito.length && enRect(mx, my, pvOrdenar)) ordenar();
}

function ordenar() {
  if (!pv.carrito.length) return;
  const items = JSON.parse(JSON.stringify(pv.carrito));
  asegurarDia();

  const total = totalItems(items);
  let costo = 0;
  for (const it of items) costo += costoItem(it);

  const orden = {
    id: pv.fecha + "-" + pv.siguiente + "-" + Date.now().toString(36),
    n: pv.siguiente,
    hora: horaTexto(new Date()),
    items: items,
    total: total,
    costo: costo,
    comision: total * COMISION_EMPLEADO
  };
  pv.siguiente++;
  pv.ordenes.push(orden);
  pv.carrito = [];

  // Para el inventario del Sheet
  const piezas = piezasDe(items);
  pv.pendientes.push({
    tipo: "orden", id: orden.id, fecha: pv.fecha, n: orden.n, hora: orden.hora,
    piezas: piezas, total: total, detalle: textoDetalle(items)
  });
  moverStockLocal(piezas, -1);
  guardarPV();
  sincronizar(true);

  ultimaOrden = orden;
  ordenDesdeHistorial = false;
  confirmarCancelar = SIN_CONFIRMAR;
  pantalla = 4;
}

function encabezadoToppings(titulo, sub, llevan, max, y) {

function dibujarChip(b, nombre, sel, lleno, colorSel) {
  const bloqueado = !sel && lleno;
  if (sel)            { fill(colorSel); noStroke(); }
  else if (bloqueado) { fill('#F4F4F4'); noStroke(); }
  else                { fill('#F7F8F7'); stroke(borde); strokeWeight(2); }
  rect(b.x, b.y, b.w, b.h, 18);
  noStroke();
  fill(sel ? blanco : (bloqueado ? color('#C2C6C2') : texto));
  textAlign(CENTER, CENTER);
  textSize(b.w > 250 ? 25 : 21);
  text((sel ? "✓ " : "") + nombre, b.x + b.w / 2, b.y + b.h / 2);
  textAlign(LEFT, CENTER);
}

function pressModalFresas(mx, my) {
  const m = modalFresas;

  if (my < MF_Y || enRect(mx, my, MF_CERRAR)) { modalFresas = null; return; }

  for (const k of ["chicas", "grandes"]) {
    if (enRect(mx, my, MF_TAM[k])) {
      if (alcanzaFresa(k)) m.tam = k;
      else avisar("No alcanzan fresas para " + FRESAS[k].corto.toLowerCase());
      return;
    }
  }

  const prem = chipsPremium();
  for (let i = 0; i < prem.length; i++) {
    if (enRect(mx, my, prem[i])) { alternarTopping(m.premium, i, MAX_PREMIUM); return; }
  }
  const clas = chipsClasicos();
  for (let i = 0; i < clas.length; i++) {
    if (enRect(mx, my, clas[i])) { alternarTopping(m.clasicos, i, MAX_CLASICOS); return; }
  }

  if (enRect(mx, my, MF_AGREGAR)) {
    if (!alcanzaFresa(m.tam)) { avisar("Ya no alcanzan fresas"); return; }
    pv.carrito.push({
      prod: "fresas",
      tam: m.tam,
      premium: m.premium.slice().sort((a, b) => a - b),
      clasicos: m.clasicos.slice().sort((a, b) => a - b)
    });
    guardarPV();
    destello[N] = millis();
    modalFresas = null;
    mantenerOrdenar = true;
  }
}

function alcanzaFresa(tam) {
  const d = disponible("Fresas");
  return d === null || d + 1e-9 >= FRESAS[tam].porcion;
}

function alternarTopping(lista, i, max) {
  const k = lista.indexOf(i);
  if (k >= 0) lista.splice(k, 1);
  else if (lista.length < max) lista.push(i);
}

function pressOrden(mx, my) {
  if (botonAtras.isOver(mx, my) && ordenDesdeHistorial) { pantalla = 7; return; }
  if (botonAtras.isOver(mx, my) || enRect(mx, my, ofNueva)) { irAPV(); return; }

  if (enRect(mx, my, OF_CANCELAR)) {
    if (millis() - confirmarCancelar < TIEMPO_CONFIRMAR) {
      const n = ultimaOrden.n;
      const id = ultimaOrden.id;
      pv.ordenes = pv.ordenes.filter(o => o.n !== n);
      moverStockLocal(piezasDe(ultimaOrden.items), +1);

      // Si la orden ni siquiera se habia enviado, basta con quitarla de la fila
      const k = pv.pendientes.findIndex(op => op.tipo === "orden" && op.id === id);
      if (k >= 0) pv.pendientes.splice(k, 1);
      else pv.pendientes.push({ tipo: "cancelar", id: id });
      guardarPV();
      sincronizar(false);
      ultimaOrden = null;
      confirmarCancelar = SIN_CONFIRMAR;
      if (ordenDesdeHistorial) { ordenDesdeHistorial = false; pantalla = 7; }
      else irAPV();
    } else {
      confirmarCancelar = millis();
    }
  }
}

let ordenDesdeHistorial = false;

  asegurarDia();

}

function pantallaHistorial() {
  botonAtras.display();

  // Solo las ordenes despues del ultimo reinicio (↺), la mas nueva primero
  const ordenes = pv.ordenes.filter(o => o.n > (pv.corte || 0)).reverse();
  let venta = 0;
  for (const o of ordenes) venta += o.total;

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(46);
  text("Historial de hoy", 158, 80);
  fill(textoSecundario);
  textSize(24);
  text(textoFecha(fechaDesdeIso(pv.fecha)) + (pv.corte ? " · desde el reinicio" : ""), 160, 128);

  // Resumen del dia
  noStroke();
  fill(blanco);
  rect(30, 165, 640, 130, 24);
  const datos = [
    ["ÓRDENES", String(ordenes.length)],
    ["VENDIDO", "$" + formato(venta)],
    ["COMISIÓN 18%", "$" + formato(venta * COMISION_EMPLEADO)]
  ];
  datos.forEach(([etq, val], i) => {
    const x = 60 + i * 205;
    fill(textoSecundario);
    textSize(19);
    text(etq, x, 205);
    fill(texto);
    textStyle(BOLD);
    textSize(32);
    text(val, x, 250);
    textStyle(NORMAL);
  });

  hist.zonas = [];
  hist.botones = {};
  let y = 317;

  if (!ordenes.length) {
    fill(blanco);
    rect(30, y, 640, 160, 24);
    fill(textoSecundario);
    textAlign(CENTER, CENTER);
    textSize(25);
    text("Todavía no hay órdenes hoy", 350, y + 80);
    textAlign(LEFT, CENTER);
    altoContenido = y + 190;
    return;
  }

  // Por paginas, para que la pantalla no crezca sin limite
  const paginas = Math.ceil(ordenes.length / HIST_POR_PAGINA);
  hist.pagina = Math.min(hist.pagina, paginas - 1);
  const desde = hist.pagina * HIST_POR_PAGINA;
  const visibles = ordenes.slice(desde, desde + HIST_POR_PAGINA);

  for (const o of visibles) {
    y = tarjetaHistorial(o, y) + 16;
  }

  if (paginas > 1) {
    fill(textoSecundario);
    textAlign(CENTER, CENTER);
    textSize(22);
    text("Página " + (hist.pagina + 1) + " de " + paginas, 350, y + 40);
    textAlign(LEFT, CENTER);
    if (hist.pagina > 0) {
      hist.botones.ant = { x: 30, y: y + 8, w: 190, h: 64 };
      botonChico(hist.botones.ant, "‹ Recientes");
    }
    if (hist.pagina < paginas - 1) {
      hist.botones.sig = { x: 480, y: y + 8, w: 190, h: 64 };
      botonChico(hist.botones.sig, "Anteriores ›");
    }
    y += 90;
  }
  altoContenido = y + 20;
}

function botonChico(b, etq) {
  noStroke();
  fill(blanco);
  rect(b.x, b.y, b.w, b.h, 20);
  fill(texto);
  textAlign(CENTER, CENTER);
  textSize(22);
  text(etq, b.x + b.w / 2, b.y + b.h / 2);
  textAlign(LEFT, CENTER);
}

function tarjetaHistorial(o, y) {
  // Renglones: un renglon por producto + los toppings de cada fresa
  textSize(20);
  const filas = [];
  for (const l of agruparItems(o.items)) {
    const det = l.fresas ? detallesItem(l.item).flatMap(d => partirTexto(d, 470)) : [];
    filas.push({ l: l, det: det });
  }
  let alto = 78;
  for (const f of filas) alto += 40 + f.det.length * 28;
  alto += 12;

  noStroke();
  fill(0, 12);
  rect(30, y + 4, 640, alto, 22);
  fill(blanco);
  rect(30, y, 640, alto, 22);
  hist.zonas.push({ x: 30, y: y, w: 640, h: alto, orden: o });

  // Encabezado: numero, hora y total
  fill(texto);
  textAlign(LEFT, CENTER);
  textStyle(BOLD);
  textSize(27);
  text("Orden #" + o.n, 60, y + 40);
  const w = textWidth("Orden #" + o.n);
  textStyle(NORMAL);
  fill(textoSecundario);
  textSize(23);
  text("  ·  " + o.hora, 60 + w, y + 41);
  fill(texto);
  textAlign(RIGHT, CENTER);
  textStyle(BOLD);
  textSize(28);
  text("$" + formato(o.total), 640, y + 40);
  textStyle(NORMAL);
  textAlign(LEFT, CENTER);

  stroke(borde);
  strokeWeight(1.5);
  line(60, y + 68, 640, y + 68);
  noStroke();

  let yy = y + 96;
  for (const f of filas) {
    const l = f.l;
    fill(l.fresas ? rojo : color(COLORES_PV[l.prod][1]));
    ellipse(70, yy, 13, 13);
    fill(texto);
    textSize(24);
    text((l.cant > 1 ? l.cant + " × " : "") + nombreItem(l.item), 88, yy);
    textAlign(RIGHT, CENTER);
    text("$" + formato(l.total), 640, yy);
    textAlign(LEFT, CENTER);
    fill(textoSecundario);
    textSize(20);
    f.det.forEach((d, k) => text(d, 88, yy + 30 + k * 28));
    yy += 40 + f.det.length * 28;
  }
  return y + alto;
}

function pressHistorial(mx, my) {
  if (botonAtras.isOver(mx, my)) { irAPV(); return; }
  const b = hist.botones;
  if (b.ant && enRect(mx, my, b.ant)) { hist.pagina--; window.scrollTo(0, 0); return; }
  if (b.sig && enRect(mx, my, b.sig)) { hist.pagina++; window.scrollTo(0, 0); return; }
  for (const z of hist.zonas) {
    if (enRect(mx, my, z)) {
      ultimaOrden = z.orden;
      ordenDesdeHistorial = true;
      confirmarCancelar = SIN_CONFIRMAR;
      pantalla = 4;
      return;
    }
  }
}

// ============================================================
// PANTALLA 5 - ESTADISTICAS
// Datos de la pestaña "Registro App" (un renglon por dia registrado)
// y de "Órdenes App" (hora de cada orden del Punto de Venta).
// ============================================================

const EST_KEY = "bonbon_est";
let est = { cargando: false, error: "", datos: null, actualizado: "", periodo: 7, sel: null, prodSem: 0 };
let estZonas = { chips: [], dias: [], horas: [], sem: [], semp: [], selector: null };   // donde se puede tocar

// Dias de la semana empezando en lunes
const DIAS_SEM = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const DIAS_SEM_LARGO = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábados", "domingos"];
const PRODS_SEMANA = ["Fresas con Crema"].concat(postres);

const NOMBRES_EST = postres.concat(["Fresas Chicas", "Fresas Grandes"]);

function cargarEstadisticasGuardadas() {
  try {
    const g = JSON.parse(localStorage.getItem(EST_KEY) || "null");
    if (g && g.datos) { est.datos = g.datos; est.actualizado = g.actualizado || ""; }
  } catch (e) {}
}

async function cargarEstadisticas() {
  if (est.cargando) return;
  if (!SCRIPT_URL.startsWith("https://")) return;

  let pin = leerPin();
  if (!pin) {
    pin = (window.prompt("PIN de registro (solo se pide una vez):") || "").trim();
    if (!pin) { est.error = "Falta el PIN de registro"; return; }
    guardarPin(pin);
  }

  est.cargando = true;
  est.error = "";
  try {
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ pin: pin, accion: "estadisticas" })
    });
    const j = await r.json();
    if (j.ok) {
      est.datos = { dias: j.dias || [], horas: j.horas || [] };
      est.actualizado = horaTexto(new Date());
      try { localStorage.setItem(EST_KEY, JSON.stringify({ datos: est.datos, actualizado: est.actualizado })); } catch (e) {}
    } else if (j.error === "PIN") {
      borrarPin();
      est.error = "PIN de registro incorrecto";
    } else {
      est.error = "Error en el Sheet";
    }
  } catch (e) {
    est.error = "Sin internet";
  }
  est.cargando = false;
}

// Hora de "1:55 pm", "13:55:00" o "1:55:00 p.m." -> 13
function horaDe(t) {
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  let h = Number(m[1]);
  if (/p\.?\s?m/i.test(t) && h < 12) h += 12;
  if (/a\.?\s?m/i.test(t) && h === 12) h = 0;
  return h;
}

function miles(n) {
  return Math.round(n).toLocaleString("en-US");
}

function dineroCorto(n) {
  if (n >= 1000) return "$" + (Math.round(n / 100) / 10) + "k";
  return "$" + Math.round(n);
}

// Junta los numeros del periodo elegido
function resumenEst() {
  const d = est.datos;
  if (!d) return null;

  // periodo: -1 = ultimo dia de cierre | 7 | 30 | 0 = todo
  let desde = null, soloDia = null;
  if (est.periodo === -1) {
    soloDia = d.dias.reduce((m, x) => (x.f > m ? x.f : m), "");
  } else if (est.periodo > 0) {
    desde = fechaPorDefecto();
    desde.setDate(desde.getDate() - (est.periodo - 1));
    desde.setHours(0, 0, 0, 0);
  }
  const dentro = f => soloDia !== null ? f === soloDia : (!desde || fechaDesdeIso(f) >= desde);

  const dias = d.dias.filter(x => dentro(x.f)).sort((a, b) => a.f < b.f ? -1 : 1);
  const r = { dias: dias, venta: 0, utilidad: 0, operativa: 0, postres: 0, mejor: null, soloDia: soloDia,
              porPostre: new Array(NOMBRES_EST.length).fill(0), horas: {} };

  // Por dia de la semana: cuantos dias hubo, venta y unidades de cada postre
  r.sem = { n: new Array(7).fill(0), v: new Array(7).fill(0),
            u: PRODS_SEMANA.map(() => new Array(7).fill(0)) };

  for (const x of dias) {
    const w = (fechaDesdeIso(x.f).getDay() + 6) % 7;
    r.sem.n[w]++;
    r.sem.v[w] += x.v;
    r.sem.u[0][w] += (x.fc || 0) + (x.fg || 0);
    (x.c || []).forEach((n, i) => { r.sem.u[i + 1][w] += n; });

    x.o = operativaDia(x);
    r.venta += x.v; r.utilidad += x.u; r.operativa += x.o; r.postres += x.p;
    if (!r.mejor || x.v > r.mejor.v) r.mejor = x;
    (x.c || []).forEach((n, i) => { r.porPostre[i] += n; });
    r.porPostre[N]     += x.fc || 0;
    r.porPostre[N + 1] += x.fg || 0;
  }

  for (const o of d.horas) {
    if (!dentro(o.f)) continue;
    const h = horaDe(o.h);
    if (h === null) continue;
    if (!r.horas[h]) r.horas[h] = { n: 0, t: 0 };
    r.horas[h].n++;
    r.horas[h].t += o.t;
  }

  // Muchos dias: se agrupan por semana para que las barras no queden delgaditas
  r.barras = dias.map(x => ({ etq: String(fechaDesdeIso(x.f).getDate()),
                              titulo: textoFecha(fechaDesdeIso(x.f)), v: x.v, u: x.u, o: x.o }));
  if (r.barras.length > 31) {
    const semanas = [];
    for (let k = 0; k < dias.length; k += 7) {
      const grupo = dias.slice(k, k + 7);
      const f0 = fechaDesdeIso(grupo[0].f);
      semanas.push({ etq: f0.getDate() + "/" + (f0.getMonth() + 1),
                     titulo: "Semana del " + textoFecha(f0),
                     v: grupo.reduce((a, b) => a + b.v, 0), u: grupo.reduce((a, b) => a + b.u, 0),
                     o: grupo.reduce((a, b) => a + b.o, 0) });
    }
    r.barras = semanas;
    r.semanal = true;
  }
  return r;
}

// Utilidad operativa = utilidad bruta - 18% de la venta (empleado) - renta, luz y gas del dia
function operativaDia(x) {
  return x.u - x.v * COMISION_EMPLEADO - (RENTA + LUZ + GAS);
}

function dineroSigno(n) {
  return (n < 0 ? "-$" : "$") + miles(Math.abs(n));
}

function pantallaEstadisticas() {

  fill(colSub);
  textSize(24);
  text(sub, 160, 128);

  // ---------- Periodo ----------
  const opciones = [[-1, "Día"], [7, "7 días"], [30, "30 días"], [0, "Todo"]];
  estZonas.chips = [];
  opciones.forEach(([val, etq], k) => {
    const b = { x: 30 + k * 164, y: 162, w: 148, h: 66, val: val };
    estZonas.chips.push(b);
    const sel = est.periodo === val;
    noStroke();

    rect(b.x, b.y, b.w, b.h, 33);

  const r = resumenEst();

    rect(30, 252, 640, 220, 26);
    fill(textoSecundario);
    textAlign(CENTER, CENTER);
    textSize(26);
    text(est.cargando ? "Cargando…" : "Aún no hay días registrados en este periodo.", 350, 335);
    textSize(23);
    text("Se llena cada vez que tocas REGISTRAR al cerrar el día.", 350, 385);
    textAlign(LEFT, CENTER);
    estZonas.dias = []; estZonas.horas = []; estZonas.sem = []; estZonas.semp = []; estZonas.selector = null;
    altoContenido = 500;
    return;
  }

  // ---------- Numeros grandes ----------
  const nd = r.dias.length;
  const unDia = r.soloDia !== null;
  tarjetaDato(30, 252, "VENTA TOTAL", "$" + miles(r.venta),
              unDia ? "Cierre del " + textoFecha(fechaDesdeIso(r.soloDia))
                    : nd + (nd === 1 ? " día registrado" : " días registrados"));
  tarjetaDato(360, 252, "UTILIDAD BRUTA", "$" + miles(r.utilidad),
              r.venta > 0 ? Math.round(r.utilidad / r.venta * 100) + "% de la venta" : "");
  tarjetaDato(30, 420, "UTILIDAD OPERATIVA", dineroSigno(r.operativa),
              "bruta − 18% − $" + (RENTA + LUZ + GAS) + "/día", r.operativa < 0 ? rojo : color(VERDE_OPERATIVA));
  tarjetaDato(360, 420, "POSTRES VENDIDOS", miles(r.postres),
              unDia ? "ese día" : "≈ " + Math.round(r.postres / nd) + " por día");
  if (!unDia) {
    tarjetaDato(30, 588, "VENTA PROMEDIO / DÍA", "$" + miles(r.venta / nd),
                r.mejor ? "Mejor: " + DIAS[fechaDesdeIso(r.mejor.f).getDay()] + " " +
                          fechaDesdeIso(r.mejor.f).getDate() + " · $" + miles(r.mejor.v) : "");
    tarjetaDato(360, 588, "OPERATIVA PROMEDIO", dineroSigno(r.operativa / nd), "por día",
                r.operativa < 0 ? rojo : color(VERDE_OPERATIVA));
  }

  let y = unDia ? 590 : 758;
  y = tablaDias(r, y) + 22;
  if (!unDia) {
    y = graficaVentas(r, y) + 22;
    y = graficaOperativa(r, y) + 22;
    y = graficaSemana(r, y, false) + 22;
    y = graficaSemana(r, y, true) + 22;
  } else {
    estZonas.dias = []; estZonas.sem = []; estZonas.semp = []; estZonas.selector = null;
  }
  y = graficaPostres(r, y) + 22;
  y = graficaHoras(r, y) + 22;

  altoContenido = y + 10;
}

function tarjetaDato(x, y, etq, valor, sub, colValor) {
  noStroke();
  fill(blanco);
  rect(x, y, 310, 150, 24);
  fill(textoSecundario);
  textAlign(LEFT, CENTER);
  textSize(20);
  text(etq, x + 26, y + 36);
  fill(colValor || texto);
  textStyle(BOLD);
  textSize(40);
  text(valor, x + 26, y + 84);
  textStyle(NORMAL);
  fill(textoSecundario);
  textSize(20);
  text(recortar(sub, 270), x + 26, y + 124);
}

function leyenda(items, xDer, y) {
  textSize(21);
  let x = xDer;
  for (let k = items.length - 1; k >= 0; k--) {
    const [col, etq] = items[k];
    const w = textWidth(etq);
    x -= w;
    fill(textoSecundario);
    textAlign(LEFT, CENTER);
    text(etq, x, y);
    fill(col);
    rect(x - 26, y - 8, 16, 16, 4);
    x -= 50;
  }
}

function lineasRejilla(x0, x1, yBase, alto, max, pasos, fmt) {
  fmt = fmt || dineroCorto;
  textSize(19);
  for (let k = 0; k <= pasos; k++) {
    const yy = yBase - alto * k / pasos;
    stroke(GRAF_REJILLA);
    strokeWeight(k === 0 ? 2 : 1.5);
    line(x0, yy, x1, yy);
    noStroke();
    fill(color('#9AA09A'));
    textAlign(RIGHT, CENTER);
    text(fmt(max * k / pasos), x0 - 10, yy);
  }
  textAlign(LEFT, CENTER);
}

// Escala "bonita" para el eje (1, 2, 2.5 o 5 x 10^n) con marcas en numeros redondos
function tope(max) {
  if (max <= 0) return { max: 1, pasos: 5 };
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return { max: m * p, pasos: m === 2 ? 4 : 5 };
  return { max: 10 * p, pasos: 5 };
}

// Barra con la punta de arriba redondeada y la base recta
function barraVertical(x, yBase, w, h, col) {
  if (h <= 0) return;
  fill(col);
  const r = Math.min(4, w / 2, h);
  rect(x, yBase - h, w, h, r, r, 0, 0);
}

function graficaVentas(r, y) {
  const alto = 470;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text(r.semanal ? "Ventas por semana" : "Ventas por día", 60, y + 44);
  leyenda([[GRAF_VENTA, "Venta"], [GRAF_UTILIDAD, "Utilidad bruta"]], 640, y + 46);

  const x0 = 120, x1 = 640, yBase = y + alto - 70, altoG = 290;
  const escalaY = tope(Math.max(...r.barras.map(b => b.v), 1));
  const max = escalaY.max;
  lineasRejilla(x0, x1, yBase, altoG, max, escalaY.pasos);

  const n = r.barras.length;
  const paso = (x1 - x0) / n;
  const wBar = Math.max(3, Math.min(34, (paso - 10) / 2));
  estZonas.dias = [];
  // Si hay muchas barras, solo algunas etiquetas abajo
  const cadaCuanto = Math.ceil(n / 10);

  r.barras.forEach((b, k) => {
    const cx = x0 + paso * (k + 0.5);
    const hv = altoG * b.v / max, hu = altoG * Math.max(0, b.u) / max;
    barraVertical(cx - wBar - 1, yBase, wBar, hv, GRAF_VENTA);
    barraVertical(cx + 1, yBase, wBar, hu, GRAF_UTILIDAD);
    estZonas.dias.push({ x: x0 + paso * k, y: y + 80, w: paso, h: alto - 80, k: k });

    if (k % cadaCuanto === 0 || k === n - 1) {
      fill(textoSecundario);
      textAlign(CENTER, CENTER);
      textSize(20);
      text(b.etq, cx, yBase + 28);
    }
  });
  textAlign(LEFT, CENTER);

  // Detalle al tocar una barra
  if (est.sel && est.sel.g === "dias" && r.barras[est.sel.k]) {
    const b = r.barras[est.sel.k];
    const cx = x0 + paso * (est.sel.k + 0.5);
    noFill();
    stroke(color('#C9CEC9'));
    strokeWeight(2);
    line(cx, y + 90, cx, yBase);
    noStroke();
    globo(cx, y + 92, [b.titulo, "Venta $" + miles(b.v), "Utilidad bruta $" + miles(b.u),
                       "Utilidad operativa " + dineroSigno(b.o)]);
  }
  return y + alto;
}

function graficaPostres(r, y) {
  const filas = NOMBRES_EST.map((nm, i) => ({ nm: nm, n: r.porPostre[i], i: i }))
                           .sort((a, b) => b.n - a.n);
  const altoFila = 48;
  const alto = 100 + filas.length * altoFila;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text("Postres más vendidos", 60, y + 44);

  const max = Math.max(...filas.map(f => f.n), 1);
  const xb = 330, wMax = 250;
  filas.forEach((f, k) => {
    const yy = y + 100 + k * altoFila;
    fill(f.n > 0 ? texto : color('#B4B9B4'));
    textAlign(LEFT, CENTER);
    textSize(23);
    text(f.nm, 60, yy);
    // Carril y barra (un solo color: es una sola serie)
    fill('#F1F3F1');
    rect(xb, yy - 11, wMax, 22, 4);
    if (f.n > 0) {
      fill(GRAF_VENTA);
      rect(xb, yy - 11, Math.max(6, wMax * f.n / max), 22, 4);
    }
    fill(f.n > 0 ? texto : color('#B4B9B4'));
    textAlign(RIGHT, CENTER);
    textSize(23);
    text(f.n, 640, yy);
  });
  textAlign(LEFT, CENTER);
  return y + alto;
}

function graficaHoras(r, y) {
  const hs = Object.keys(r.horas).map(Number).sort((a, b) => a - b);
  const alto = hs.length ? 430 : 170;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text("Órdenes por hora", 60, y + 44);
  fill(textoSecundario);
  textSize(21);
  text("Solo las del Punto de Venta", 60, y + 82);

  estZonas.horas = [];
  if (!hs.length) {
    textSize(23);
    text("Todavía no hay órdenes en este periodo.", 60, y + 125);
    return y + alto;
  }

  const hMin = Math.min(...hs), hMax = Math.max(...hs);
  const n = hMax - hMin + 1;
  const x0 = 100, x1 = 640, yBase = y + alto - 60, altoG = 230;
  const max = Math.max(...hs.map(h => r.horas[h].n), 1);
  const topeN = Math.max(2, Math.ceil(max / 2) * 2);

  textSize(19);
  for (let k = 0; k <= 2; k++) {
    const yy = yBase - altoG * k / 2;
    stroke(GRAF_REJILLA);
    strokeWeight(k === 0 ? 2 : 1.5);
    line(x0, yy, x1, yy);
    noStroke();
    fill(color('#9AA09A'));
    textAlign(RIGHT, CENTER);
    text(Math.round(topeN * k / 2), x0 - 10, yy);
  }

  const paso = (x1 - x0) / n;
  const wBar = Math.max(4, Math.min(40, paso - 10));
  for (let k = 0; k < n; k++) {
    const h = hMin + k;
    const d = r.horas[h] || { n: 0, t: 0 };
    const cx = x0 + paso * (k + 0.5);
    barraVertical(cx - wBar / 2, yBase, wBar, altoG * d.n / topeN, GRAF_VENTA);
    estZonas.horas.push({ x: x0 + paso * k, y: y + 100, w: paso, h: alto - 100, k: k, hora: h });
    if (n <= 12 || k % 2 === 0) {
      fill(textoSecundario);
      textAlign(CENTER, CENTER);
      textSize(19);
      const h12 = h % 12 === 0 ? 12 : h % 12;
      text(h12 + (h < 12 ? "am" : "pm"), cx, yBase + 26);
    }
  }
  textAlign(LEFT, CENTER);

  if (est.sel && est.sel.g === "horas") {
    const z = estZonas.horas[est.sel.k];
    if (z) {
      const d = r.horas[z.hora] || { n: 0, t: 0 };
      const h12 = z.hora % 12 === 0 ? 12 : z.hora % 12;
      const cx = z.x + z.w / 2;
      globo(cx, y + 100, ["De " + h12 + " a " + h12 + ":59 " + (z.hora < 12 ? "am" : "pm"),
                          d.n + (d.n === 1 ? " orden" : " órdenes") + " · $" + miles(d.t)]);
    }
  }
  return y + alto;
}

// ---------- Tabla: venta, utilidad bruta y operativa de cada dia ----------
function tablaDias(r, y) {
  const filas = r.dias.slice().reverse().slice(0, 31);       // el mas nuevo primero
  const altoFila = 52;
  const alto = 150 + filas.length * altoFila + 70 + (r.dias.length > 31 ? 40 : 0);
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text(r.soloDia !== null ? "Detalle del día" : "Detalle por día", 60, y + 44);

  const cols = [[330, "VENTA"], [485, "U. BRUTA"], [640, "U. OPERATIVA"]];
  fill(textoSecundario);
  textSize(18);
  text("DÍA", 60, y + 104);
  textAlign(RIGHT, CENTER);
  cols.forEach(([x, etq]) => text(etq, x, y + 104));
  stroke(borde);
  strokeWeight(2);
  line(60, y + 126, 640, y + 126);
  noStroke();

  filas.forEach((x, k) => {
    const yy = y + 155 + k * altoFila;
    const f = fechaDesdeIso(x.f);
    fill(texto);
    textAlign(LEFT, CENTER);
    textSize(23);
    text(DIAS[f.getDay()] + " " + f.getDate() + " " + MESES[f.getMonth()], 60, yy);
    textAlign(RIGHT, CENTER);
    text("$" + miles(x.v), 330, yy);
    text("$" + miles(x.u), 485, yy);
    fill(x.o < 0 ? rojo : color(VERDE_OPERATIVA));
    text(dineroSigno(x.o), 640, yy);
  });

  let yt = y + 155 + filas.length * altoFila - 10;
  if (r.dias.length > 31) {
    fill(textoSecundario);
    textAlign(LEFT, CENTER);
    textSize(20);
    text("Se muestran los 31 días más recientes; el total incluye todos.", 60, yt + 12);
    yt += 40;
  }
  stroke(borde);
  strokeWeight(2);
  line(60, yt, 640, yt);
  noStroke();
  textStyle(BOLD);
  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(24);
  text("Total", 60, yt + 36);
  textAlign(RIGHT, CENTER);
  text("$" + miles(r.venta), 330, yt + 36);
  text("$" + miles(r.utilidad), 485, yt + 36);
  fill(r.operativa < 0 ? rojo : color(VERDE_OPERATIVA));
  text(dineroSigno(r.operativa), 640, yt + 36);
  textStyle(NORMAL);
  textAlign(LEFT, CENTER);
  return y + alto;
}

// ---------- Utilidad operativa por dia (puede ser negativa) ----------
function graficaOperativa(r, y) {
  const alto = 450;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);
  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text(r.semanal ? "Utilidad operativa por semana" : "Utilidad operativa por día", 60, y + 44);
  fill(textoSecundario);
  textSize(21);
  text("Utilidad bruta − 18% del empleado − renta, luz y gas", 60, y + 82);

  const vals = r.barras.map(b => b.o);
  const maxP = Math.max(0, ...vals), minN = Math.min(0, ...vals);
  const arriba = maxP > 0 ? tope(maxP).max : 0;
  const abajo = minN < 0 ? tope(-minN).max : 0;
  const rango = Math.max(arriba + abajo, 1);
  const x0 = 120, x1 = 640, yTop = y + 120, altoG = 250;
  const yCero = yTop + altoG * arriba / rango;
  const fmt = n => (n < 0 ? "-" : "") + dineroCorto(Math.abs(n));

  // Rejilla: tope, cero y fondo
  const marcas = [[arriba, yTop], [0, yCero]];
  if (abajo > 0) marcas.push([-abajo, yTop + altoG]);
  textSize(19);
  for (const [val, yy] of marcas) {
    stroke(GRAF_REJILLA);
    strokeWeight(val === 0 ? 2.5 : 1.5);
    line(x0, yy, x1, yy);
    noStroke();
    fill(color('#9AA09A'));
    textAlign(RIGHT, CENTER);
    text(fmt(val), x0 - 10, yy);
  }

  const n = r.barras.length;
  const paso = (x1 - x0) / n;
  const wBar = Math.max(4, Math.min(40, paso - 12));
  const cadaCuanto = Math.ceil(n / 10);
  r.barras.forEach((b, k) => {
    const cx = x0 + paso * (k + 0.5);
    const h = altoG * Math.abs(b.o) / rango;
    fill(GRAF_OPERATIVA);
    if (b.o >= 0) rect(cx - wBar / 2, yCero - h, wBar, h, Math.min(4, h), Math.min(4, h), 0, 0);
    else          rect(cx - wBar / 2, yCero, wBar, h, 0, 0, Math.min(4, h), Math.min(4, h));
    if (k % cadaCuanto === 0 || k === n - 1) {
      fill(textoSecundario);
      textAlign(CENTER, CENTER);
      textSize(20);
      text(b.etq, cx, yTop + altoG + 30);
    }
  });
  textAlign(LEFT, CENTER);
  return y + alto;
}

// ---------- Por dia de la semana ----------
// esProducto = false: venta promedio en pesos
// esProducto = true : unidades promedio del postre elegido (Fresas por defecto)
function graficaSemana(r, y, esProducto) {
  const alto = esProducto ? 560 : 480;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text(esProducto ? "¿Qué día se vende más?" : "Venta por día de la semana", 60, y + 44);

  const k = est.prodSem;
  const sumas = esProducto ? r.sem.u[k] : r.sem.v;
  const prom = sumas.map((s, w) => r.sem.n[w] ? s / r.sem.n[w] : null);

  // Selector de postre:  ‹  Fresas con Crema  ›
  let yTexto = y + 88;
  if (esProducto) {
    const ant = { x: 60, y: y + 78, w: 76, h: 62 }, sig = { x: 564, y: y + 78, w: 76, h: 62 };
    const pill = { x: 146, y: y + 78, w: 408, h: 62 };
    estZonas.selector = { ant: ant, sig: sig, pill: pill };
    fill('#F2F4F2');
    rect(ant.x, ant.y, ant.w, ant.h, 31);
    rect(sig.x, sig.y, sig.w, sig.h, 31);
    fill(color(AZUL));
    rect(pill.x, pill.y, pill.w, pill.h, 31);
    fill(textoSecundario);
    textAlign(CENTER, CENTER);
    textSize(38);
    text("‹", ant.x + ant.w / 2, ant.y + ant.h / 2 - 3);
    text("›", sig.x + sig.w / 2, sig.y + sig.h / 2 - 3);
    fill(blanco);
    textSize(26);
    text(PRODS_SEMANA[k], pill.x + pill.w / 2, pill.y + pill.h / 2);
    textAlign(LEFT, CENTER);
    yTexto = y + 172;
  }

  // Frase con el mejor dia
  let mejor = -1;
  prom.forEach((p, w) => { if (p !== null && (mejor < 0 || p > prom[mejor])) mejor = w; });
  fill(textoSecundario);
  textSize(23);
  if (mejor < 0 || prom[mejor] <= 0) {
    text(esProducto ? "Sin ventas de " + PRODS_SEMANA[k] + " en este periodo" : "Sin datos en este periodo", 60, yTexto);
  } else {
    const val = esProducto ? "≈ " + (Math.round(prom[mejor] * 10) / 10) + " por día"
                           : "≈ $" + miles(prom[mejor]) + " por día";
    fill(texto);
    textStyle(BOLD);
    const t1 = "Más los " + DIAS_SEM_LARGO[mejor];
    text(t1, 60, yTexto);
    const w1 = textWidth(t1);
    textStyle(NORMAL);
    fill(textoSecundario);
    text("  " + val, 60 + w1, yTexto);
  }

  // Barras (una sola serie: promedio por dia)
  const x0 = 120, x1 = 640, yBase = y + alto - 64;
  const altoG = esProducto ? 250 : 270;
  const maxDato = Math.max(...prom.map(p => p || 0), esProducto ? 1 : 100);
  const escalaY = tope(maxDato);
  const fmtUnid = n => (Math.round(n * 10) / 10).toString();
  lineasRejilla(x0, x1, yBase, altoG, escalaY.max, escalaY.pasos, esProducto ? fmtUnid : dineroCorto);

  const paso = (x1 - x0) / 7;
  const wBar = Math.min(44, paso - 16);
  const zonas = [];
  for (let w = 0; w < 7; w++) {
    const cx = x0 + paso * (w + 0.5);
    if (prom[w] !== null) barraVertical(cx - wBar / 2, yBase, wBar, altoG * prom[w] / escalaY.max, GRAF_VENTA);
    fill(r.sem.n[w] ? textoSecundario : color('#C2C6C2'));
    textAlign(CENTER, CENTER);
    textSize(21);
    text(DIAS_SEM[w], cx, yBase + 28);
    zonas.push({ x: x0 + paso * w, y: yBase - altoG - 20, w: paso, h: altoG + 60, k: w });
  }
  textAlign(LEFT, CENTER);
  if (esProducto) estZonas.semp = zonas; else estZonas.sem = zonas;

  const g = esProducto ? "semp" : "sem";
  if (est.sel && est.sel.g === g) {
    const w = est.sel.k;
    const cx = x0 + paso * (w + 0.5);
    const n = r.sem.n[w];
    const nom = DIAS_SEM_LARGO[w].charAt(0).toUpperCase() + DIAS_SEM_LARGO[w].slice(1);
    const lineas = [nom + " · " + n + (n === 1 ? " día registrado" : " días registrados")];
    if (n) {
      if (esProducto) lineas.push("Promedio " + fmtUnid(prom[w]) + " por día · total " + sumas[w]);
      else lineas.push("Promedio $" + miles(prom[w]) + " · total $" + miles(sumas[w]));
    }
    globo(cx, yBase - altoG - 10, lineas);
  }
  return y + alto;
}

// Cuadrito de detalle (se acomoda para no salirse de la tarjeta)
function globo(cx, y, lineas) {
  textSize(22);
  const w = Math.max(...lineas.map(l => textWidth(l))) + 36;
  const h = lineas.length * 32 + 20;
  const x = Math.min(Math.max(cx - w / 2, 40), 660 - w);
  noStroke();
  fill(0, 25);
  rect(x, y + 4, w, h, 14);
  fill('#252925');
  rect(x, y, w, h, 14);
  textAlign(LEFT, CENTER);
  lineas.forEach((l, k) => {
    fill(k === 0 ? color(255, 170) : blanco);
    text(l, x + 18, y + 26 + k * 32);
  });
}

function pressEstadisticas(mx, my) {
  if (botonAtras.isOver(mx, my)) { irAInicio(); return; }
  if (enRect(mx, my, { x: 150, y: 105, w: 520, h: 46 })) { cargarEstadisticas(); return; }

  for (const c of estZonas.chips) {
    if (enRect(mx, my, c)) { est.periodo = c.val; est.sel = null; return; }
  }
  for (const z of estZonas.dias) {
    if (enRect(mx, my, z)) {
      est.sel = (est.sel && est.sel.g === "dias" && est.sel.k === z.k) ? null : { g: "dias", k: z.k };
      return;
    }
  }
  const sl = estZonas.selector;
  if (sl) {
    const total = PRODS_SEMANA.length;
    if (enRect(mx, my, sl.ant)) { est.prodSem = (est.prodSem + total - 1) % total; est.sel = null; return; }
    if (enRect(mx, my, sl.sig) || enRect(mx, my, sl.pill)) { est.prodSem = (est.prodSem + 1) % total; est.sel = null; return; }
  }
  for (const [g, lista] of [["sem", estZonas.sem], ["semp", estZonas.semp]]) {
    for (const z of lista) {
      if (enRect(mx, my, z)) {
        est.sel = (est.sel && est.sel.g === g && est.sel.k === z.k) ? null : { g: g, k: z.k };
        return;
      }
    }
  }
  for (const z of estZonas.horas) {
    if (enRect(mx, my, z)) {
      est.sel = (est.sel && est.sel.g === "horas" && est.sel.k === z.k) ? null : { g: "horas", k: z.k };
      return;
    }
  }
  est.sel = null;
}


// ============================================================
// PANTALLA 6 - RECETAS (se leen de la pestaña "Recetas" del Sheet)
// Tambien de ahi salen los COSTOS que usa la app: si cambias el
// precio de un insumo en el Sheet, la app toma el costo nuevo.
// ============================================================

const REC_KEY = "bonbon_recetas";
let rec = { cargando: false, error: "", datos: null, actualizado: "", sel: null };
let recZonas = [];

const AMARILLO = '#F2C230', AMARILLO_HOVER = '#F5CD55', TEXTO_AMARILLO = '#4A3B00';

function cargarRecetasGuardadas() {
  try {
    const g = JSON.parse(localStorage.getItem(REC_KEY) || "null");
    if (g && g.datos) {
      rec.datos = g.datos;
      rec.actualizado = g.actualizado || "";
      aplicarCostosReceta(g.datos);
    }
  } catch (e) {}
}

// interactivo = lo pidio una persona (puede preguntar el PIN)
async function cargarRecetas(interactivo) {
  if (rec.cargando) return;
  if (!SCRIPT_URL.startsWith("https://")) return;

  let pin = leerPin();
  if (!pin) {
    if (!interactivo) return;
    pin = (window.prompt("PIN de registro (solo se pide una vez):") || "").trim();
    if (!pin) { rec.error = "Falta el PIN de registro"; return; }
    guardarPin(pin);
  }

  rec.cargando = true;
  rec.error = "";
  try {
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ pin: pin, accion: "recetas" })
    });
    const j = await r.json();
    if (j.ok && j.productos && j.productos.length) {
      rec.datos = { productos: j.productos, toppings: j.toppings || [], notaToppings: j.notaToppings || "" };
      rec.actualizado = horaTexto(new Date());
      aplicarCostosReceta(rec.datos);
      try { localStorage.setItem(REC_KEY, JSON.stringify({ datos: rec.datos, actualizado: rec.actualizado })); } catch (e) {}
    } else if (j.error === "PIN") {
      borrarPin();
      rec.error = "PIN de registro incorrecto";
    } else {
      rec.error = j.ok ? "No encontré la pestaña Recetas" : "Error en el Sheet";
    }
  } catch (e) {
    rec.error = "Sin internet";
  }
  rec.cargando = false;
}

// Nombre en la hoja Recetas -> postre de la app (indice) o "chicas"/"grandes"
function productoDeReceta(nombre) {
  const n = clave(nombre);
  if (n.includes("fresas con crema")) return n.includes("grande") ? "grandes" : "chicas";
  if (n.includes("vasito"))    return 8;
  if (n.includes("oreo"))      return 6;
  if (n.includes("cheesecake")) return 5;
  if (n.includes("carlota"))   return 0;
  if (n.includes("elote"))     return 7;
  if (n.includes("besito"))    return 4;
  if (n.includes("flan"))      return 2;
  if (n.includes("pay"))       return 1;
  if (n.includes("tiramisu"))  return 3;
  return null;
}

function toppingDeReceta(nombre) {
  const n = clave(nombre);
  const prem = ["lotus", "nuez", "kitkat", "bubulubu"];
  const clas = ["oreo", "luneta", "mazapan", "chocolate", "coco", "colores"];
  for (let i = 0; i < prem.length; i++) if (n.includes(prem[i])) return { lista: TOP_PREMIUM, i: i };
  for (let i = 0; i < clas.length; i++) if (n.includes(clas[i])) return { lista: TOP_CLASICOS, i: i };
  return null;
}

// Pone en la app el "COSTO UNITARIO DEL PRODUCTO" de cada receta y el costo de cada topping
function aplicarCostosReceta(datos) {
  for (const p of datos.productos || []) {
    const k = productoDeReceta(p.nombre);
    if (k === null || !(p.costoUnit > 0)) continue;
    if (k === "chicas" || k === "grandes") FRESAS[k].costo = p.costoUnit;
    else costos[k] = p.costoUnit;
  }
  for (const t of datos.toppings || []) {
    const m = toppingDeReceta(t.n);
    if (m && t.costo > 0) m.lista[m.i].costo = t.costo;
  }
}

// "CARLOTA DE LIMÓN" -> "Carlota de Limón"
function nombreBonito(t) {
  const chicas = ["de", "con", "y"];
  return String(t).toLowerCase().split(" ").map((p, k) => {
    if (k > 0 && chicas.includes(p)) return p;
    if (p.startsWith("(")) return "(" + p.charAt(1).toUpperCase() + p.slice(2);
    return p.charAt(0).toUpperCase() + p.slice(1);
  }).join(" ");
}

function colorReceta(p) {
  const k = productoDeReceta(p.nombre);
  if (k === "chicas" || k === "grandes" || k === null) return [color('#FDE3E8'), rojo];
  return [color(COLORES_PV[k][0]), color(COLORES_PV[k][1])];
}

function irARecetas() {
  pantalla = 6;
  rec.sel = null;
  cargarRecetas(true);
}

function pantallaRecetas() {
  if (rec.sel !== null && rec.datos && rec.datos.productos[rec.sel]) { detalleReceta(rec.datos.productos[rec.sel]); return; }

  botonAtras.display();

  textAlign(LEFT, CENTER);

  else if (rec.error) { sub = rec.error + (rec.datos ? " · datos guardados" : ""); colSub = rojo; }

  textSize(24);
  text(sub, 160, 128);

  recZonas = [];
  if (!rec.datos) {
    fill(blanco);
    rect(30, 170, 640, 200, 26);
    fill(textoSecundario);
    textAlign(CENTER, CENTER);
    textSize(25);
    text(rec.cargando ? "Cargando…" : "No se pudieron cargar las recetas.", 350, 250);
    textSize(22);
    text("Toca arriba para reintentar.", 350, 295);
    textAlign(LEFT, CENTER);
    altoContenido = 400;
    return;
  }

  // Tarjetas de postres (2 columnas)
  const ps = rec.datos.productos;
  ps.forEach((p, k) => {
    const b = { x: k % 2 === 0 ? 30 : 360, y: 168 + Math.floor(k / 2) * 178, w: 310, h: 160, k: k };
    recZonas.push(b);
    const [bg, acc] = colorReceta(p);
    noStroke();
    fill(0, 14);
    rect(b.x, b.y + 5, b.w, b.h, 24);
    fill(bg);
    rect(b.x, b.y, b.w, b.h, 24);
    fill(acc);
    rect(b.x + 22, b.y + 22, 36, 8, 4);

    // Nombre en 1 o 2 renglones
    textStyle(BOLD);
    textSize(26);
    const lineas = partirTexto(nombreBonito(p.nombre), b.w - 44).slice(0, 2);
    lineas.forEach((l, i) => text(l, b.x + 22, b.y + 58 + i * 30));
    textStyle(NORMAL);

    fill(texto);
    textSize(22);
    text("Costo $" + formato(p.costoUnit || 0), b.x + 22, b.y + b.h - 30);
    textAlign(RIGHT, CENTER);
    fill(textoSecundario);
    text("$" + Math.round(p.precio || 0), b.x + b.w - 20, b.y + b.h - 30);
    textAlign(LEFT, CENTER);
  });

  let y = 168 + Math.ceil(ps.length / 2) * 178 + 10;

  // Toppings
  const tops = rec.datos.toppings || [];
  if (tops.length) {
    const alto = 100 + tops.length * 56;
    fill(blanco);
    rect(30, y, 640, alto, 26);
    fill(texto);
    textSize(30);
    text("Toppings", 60, y + 44);
    fill(textoSecundario);
    textSize(21);
    text("Costo por porción", 640 - textWidth("Costo por porción") - 0, y + 46);
    tops.forEach((t, i) => {
      const yy = y + 100 + i * 56;
      fill(t.tipo === "PREMIUM" ? rojo : verde);
      ellipse(70, yy, 14, 14);
      fill(texto);
      textSize(24);
      textAlign(LEFT, CENTER);
      text(recortar(t.n, 380), 90, yy - 6);
      fill(textoSecundario);
      textSize(19);
      text((t.tipo === "PREMIUM" ? "Premium" : "Clásico") + " · paquete $" + formato(t.precio || 0) + " · " + t.porc, 90, yy + 18);
      fill(texto);
      textSize(24);
      textAlign(RIGHT, CENTER);
      text("$" + formato(t.costo || 0), 640, yy - 4);
      textAlign(LEFT, CENTER);
    });
    y += alto + 20;
  }

  if (rec.datos.notaToppings) {
    textSize(23);
    const lineas = partirTexto("Toppings: " + rec.datos.notaToppings, 570);
    const alto = 40 + lineas.length * 34;
    fill(blanco);
    rect(30, y, 640, alto, 26);
    fill(texto);
    lineas.forEach((l, i) => text(l, 60, y + 37 + i * 34));
    y += alto + 20;
  }

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(21);
  text(rec.actualizado ? "Leído del Sheet a las " + rec.actualizado : "", 350, y + 10);
  text("Los costos de la app se actualizan solos con esta hoja", 350, y + 42);
  textAlign(LEFT, CENTER);
  altoContenido = y + 70;
}

function detalleReceta(p) {
  botonAtras.display();
  const [bg, acc] = colorReceta(p);

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(40);
  text(recortar(nombreBonito(p.nombre), 500), 158, 80);
  fill(textoSecundario);
  textSize(24);
  const sub = (p.rinde ? "Rinde " + p.rinde + " piezas" : "Receta") +
              (p.porcion ? " · " + p.porcion + " por pieza" : "");
  text(recortar(sub, 510), 160, 128);

  // Resumen
  noStroke();
  fill(bg);
  rect(30, 165, 640, 250, 26);
  const datos = [
    ["COSTO POR PIEZA", "$" + formato(p.costoUnit || 0)],
    ["PRECIO", "$" + formato(p.precio || 0)],
    ["UTILIDAD BRUTA", "$" + formato(p.utilidad || 0)],
    ["MULTIPLICADOR", p.multiplicador ? (Math.round(p.multiplicador * 100) / 100) + "×" : "-"]
  ];
  datos.forEach(([etq, val], i) => {
    const x = i % 2 === 0 ? 65 : 375, yy = 215 + Math.floor(i / 2) * 110;
    fill(acc);
    textSize(20);
    text(etq, x, yy);
    fill(texto);
    textStyle(BOLD);
    textSize(38);
    text(val, x, yy + 46);
    textStyle(NORMAL);
  });

  let y = 437;

  // Porcion por pieza y comentarios de la receta
  if (p.porcion || p.comentarios) y = notasReceta(p, y) + 20;

  y = seccionReceta("Ingredientes", p.ingredientes, y, [
    ["Costo de toda la receta", p.costoReceta],
    ["Por pieza (÷ " + (p.rinde || "?") + ")", p.costoUnitReceta]
  ]) + 20;
  if (p.desechables.length) y = seccionReceta("Desechables", p.desechables, y, null) + 20;
  if (p.indirectos.length)  y = seccionReceta("Costos indirectos", p.indirectos, y, null) + 20;

  // Total
  fill(verde);
  rect(30, y, 640, 120, 26);
  fill(255, 210);
  textSize(20);
  text("COSTO POR PIEZA (RECETA + DESECHABLES + INDIRECTOS)", 65, y + 38);
  fill(blanco);
  textStyle(BOLD);
  textSize(40);
  text("$" + formato(p.costoUnit || 0), 65, y + 84);
  textStyle(NORMAL);
  altoContenido = y + 150;
}

function notasReceta(p, y) {
  textSize(24);
  const lineas = p.comentarios ? partirTexto(p.comentarios, 570) : [];
  const alto = 30 + (p.porcion ? 56 : 0) + (lineas.length ? 42 + lineas.length * 34 : 0) + 8;
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);
  let yy = y + 44;
  textAlign(LEFT, CENTER);
  if (p.porcion) {
    fill(textoSecundario);
    textSize(20);
    text("PORCIÓN POR PIEZA", 60, yy);
    fill(texto);
    textStyle(BOLD);
    textSize(30);
    textAlign(RIGHT, CENTER);
    text(p.porcion, 640, yy);
    textStyle(NORMAL);
    textAlign(LEFT, CENTER);
    yy += 56;
  }
  if (lineas.length) {
    fill(textoSecundario);
    textSize(20);
    text("COMENTARIOS", 60, yy);
    yy += 42;
    fill(texto);
    textSize(24);
    lineas.forEach((l, i) => text(l, 60, yy + i * 34));
  }
  return y + alto;
}

function seccionReceta(titulo, filas, y, totales) {
  const altoFila = 70;
  const alto = 92 + filas.length * altoFila + (totales ? totales.length * 46 + 20 : 0);
  noStroke();
  fill(blanco);
  rect(30, y, 640, alto, 26);
  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(29);
  text(titulo, 60, y + 44);
  fill(textoSecundario);
  textSize(19);
  textAlign(RIGHT, CENTER);
  text("COSTO", 640, y + 46);
  textAlign(LEFT, CENTER);

  filas.forEach((f, i) => {
    const yy = y + 104 + i * altoFila;
    fill(texto);
    textSize(24);
    text(recortar(f.n, 450), 60, yy - 10);
    fill(textoSecundario);
    textSize(19);
    const partes = [];
    if (f.cu) partes.push("$" + formato(f.cu) + " el paquete");
    if (f.porc) partes.push("usa " + f.porc);
    text(recortar(partes.join(" · "), 470), 60, yy + 17);
    fill(texto);
    textSize(24);
    textAlign(RIGHT, CENTER);
    text("$" + formato(f.cp || 0), 640, yy - 4);
    textAlign(LEFT, CENTER);
  });

  if (totales) {
    let yy = y + 92 + filas.length * altoFila + 8;
    stroke(borde);
    strokeWeight(2);
    line(60, yy, 640, yy);
    noStroke();
    totales.forEach(([etq, val], i) => {
      const yt = yy + 30 + i * 46;
      fill(i === 0 ? texto : textoSecundario);
      textSize(i === 0 ? 24 : 22);
      text(etq, 60, yt);
      textAlign(RIGHT, CENTER);
      textStyle(i === 0 ? BOLD : NORMAL);
      text(val === null || val === undefined ? "-" : "$" + formato(val), 640, yt);
      textStyle(NORMAL);
      textAlign(LEFT, CENTER);
    });
  }
  return y + alto;
}

function pressRecetas(mx, my) {
  if (botonAtras.isOver(mx, my)) {
    if (rec.sel !== null) { rec.sel = null; window.scrollTo(0, 0); }
    else irAInicio();
    return;
  }
  if (rec.sel !== null) return;
  if (enRect(mx, my, { x: 150, y: 105, w: 520, h: 46 })) { cargarRecetas(true); return; }
  for (const z of recZonas) {
    if (enRect(mx, my, z)) { rec.sel = z.k; window.scrollTo(0, 0); return; }
  }
}

function construirTecladoPin() {

  const xs = [50, 255, 460];

  if (pinDueno.length < 8) pinDueno += d;
  pinError = "";

// SHA-256 sin esperas (iOS solo permite Face ID si se pide en el mismo toque)
function sha256Sync(texto) {
  const bytes = Array.from(new TextEncoder().encode(texto));
  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];
  let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const largoBits = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(largoBits / Math.pow(2, i * 8)) & 0xff);
  const rot = (x, n) => (x >>> n) | (x << (32 - n));
  const w = new Array(64);
  for (let i = 0; i < bytes.length; i += 64) {
    for (let t = 0; t < 16; t++) {
      w[t] = (bytes[i + 4 * t] << 24) | (bytes[i + 4 * t + 1] << 16) | (bytes[i + 4 * t + 2] << 8) | bytes[i + 4 * t + 3];
    }
    for (let t = 16; t < 64; t++) {
      const s0 = rot(w[t - 15], 7) ^ rot(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rot(w[t - 2], 17) ^ rot(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let t = 0; t < 64; t++) {
      const S1 = rot(e, 6) ^ rot(e, 11) ^ rot(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[t] + w[t]) | 0;
      const S0 = rot(a, 2) ^ rot(a, 13) ^ rot(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h = [h[0] + a, h[1] + b, h[2] + c, h[3] + d, h[4] + e, h[5] + f, h[6] + g, h[7] + hh].map(x => x | 0);
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

// ---------- FACE ID (llave de acceso del iPhone) ----------
// La primera vez entras con tu PIN y marcas "Usar Face ID"; el iPhone guarda una
// llave de acceso. Despues, al tocar un boton de dueño, se pide Face ID.
// Si Face ID falla o lo cancelas, se puede usar el PIN.
const FACE_KEY = "bonbon_faceid";
let face = { disponible: false, activar: false, verificando: false };

function faceIdGuardado() {
  try { return localStorage.getItem(FACE_KEY) || ""; } catch (e) { return ""; }
}

function revisarFaceId() {
  try {
    if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
        .then(ok => { face.disponible = !!ok; }).catch(() => {});
    }
  } catch (e) {}
}

function bytesAleatorios(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function aBase64(buf) { return btoa(String.fromCharCode.apply(null, Array.from(new Uint8Array(buf)))); }
function deBase64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

// Se llaman en el mismo toque (iOS lo exige)
function crearFaceId() {
  return navigator.credentials.create({ publicKey: {
    challenge: bytesAleatorios(32),
    rp: { name: "BON BON" },
    user: { id: bytesAleatorios(16), name: "dueno-bonbon", displayName: "Dueño BON BON" },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
    timeout: 60000
  }}).then(c => {
    try { localStorage.setItem(FACE_KEY, aBase64(c.rawId)); } catch (e) {}
    return true;
  });
}

function pedirFaceId() {
  return navigator.credentials.get({ publicKey: {
    challenge: bytesAleatorios(32),
    allowCredentials: [{ type: "public-key", id: deBase64(faceIdGuardado()), transports: ["internal"] }],
    userVerification: "required",
    timeout: 60000
  }}).then(() => true);
}

function entrarModo(modo) {
  if (modo === "dueno")        irACaptura();
  else if (modo === "estad")   irAEstadisticas();
  else if (modo === "recetas") irARecetas();
}

// Botones de dueño: primero Face ID (si esta activado), si no, el PIN
function entrarDueno(modo) {
  if (faceIdGuardado() && navigator.credentials && !face.verificando) {
    face.verificando = true;
    pedirFaceId()
      .then(() => { face.verificando = false; entrarModo(modo); })
      .catch(() => { face.verificando = false; abrirPin(modo); pinError = "Usa tu PIN (Face ID no se completó)"; });
    return;
  }
  abrirPin(modo);
}

function verificarPinDueno() {
  if (pinDueno === null || pinDueno === "") return;
  const esperado = pinModo === "reinicio" ? PIN_REGISTRO_HASH : PIN_DUENO_HASH;
  const ok = sha256Sync("bonbon:" + pinDueno) === esperado;
  if (ok) {
    pinDueno = null;
    if (pinModo === "reinicio") { reiniciarVendido(); return; }
    // PIN correcto y marcaste "Usar Face ID": se guarda la llave de acceso (en este mismo toque)
    if (face.activar && face.disponible && !faceIdGuardado()) {
      const modo = pinModo;
      face.activar = false;
      crearFaceId()
        .then(() => { avisar("Face ID activado"); entrarModo(modo); })
        .catch(() => entrarModo(modo));
      return;
    }
    entrarModo(pinModo);
  } else {
    pinDueno = "";
    pinError = "PIN incorrecto";
  }
}

function dibujarPinDueno() {
  noStroke();
  fill(0, 115);
  rect(0, -OFFSET_Y - dyOverlay - 10, BASE_W, PIN_Y + OFFSET_Y + dyOverlay + 10);
  fill(blanco);
  rect(-20, PIN_Y, BASE_W + 40, 4000, 30);

  fill(texto);
  textAlign(CENTER, CENTER);
  textStyle(BOLD);
  textSize(34);
  text(pinModo === "reinicio" ? "Reiniciar vendido hoy" : "PIN de dueño", 350, PIN_Y + 65);
  textStyle(NORMAL);
  fill(textoSecundario);
  textSize(25);
  text(pinModo === "reinicio" ? "Escribe el PIN de registro para confirmar"
       : pinModo === "estad" ? "Para ver Estadísticas"
       : pinModo === "recetas" ? "Para ver Recetas" : "Para entrar a Conteo Postres", 350, PIN_Y + 105);

  // Puntitos
  const n = pinDueno.length;
  if (n === 0) {
    fill(color('#B4B9B4'));
    textSize(27);
    text("Escribe tu PIN", 350, PIN_Y + 180);
  } else {
    fill(texto);
    const sep = 40, x0 = 350 - (n - 1) * sep / 2;
    for (let i = 0; i < n; i++) ellipse(x0 + i * sep, PIN_Y + 180, 22, 22);
  }

  if (pinError) {
    fill(rojo);
    textSize(26);
    text(pinError, 350, PIN_Y + 245);
  }

  for (const t of pinTeclas) {
    noStroke();
    fill('#F2F4F2');
    rect(t.x, t.y, t.w, t.h, 18);
    textAlign(CENTER, CENTER);
    if (t.label === "<")          { fill(textoSecundario); textSize(40); text("←", t.x + t.w/2, t.y + t.h/2); }
    else if (t.label === "SALIR") { fill(textoSecundario); textSize(27); text("SALIR", t.x + t.w/2, t.y + t.h/2); }
    else                          { fill(texto); textSize(40); text(t.label, t.x + t.w/2, t.y + t.h/2); }
  }

  const b = PIN_ENTRAR;
  const activo = n > 0;
  fill(activo ? verde : color('#D9DCD9'));
  rect(b.x, b.y, b.w, b.h, 20);
  fill(activo ? blanco : color('#A5AAA5'));
  textSize(31);
  text("ENTRAR", b.x + b.w/2, b.y + b.h/2);

  // Face ID: activar (primera vez) o volver a intentar
  if (pinModo !== "reinicio" && (face.disponible || faceIdGuardado())) {
    const f = PIN_FACE;
    const guardado = !!faceIdGuardado();
    noStroke();
    fill(guardado ? color('#EEF3FA') : (face.activar ? color('#E4F1E8') : color('#F2F4F2')));
    rect(f.x, f.y, f.w, f.h, 18);
    textAlign(CENTER, CENTER);
    textSize(24);
    fill(texto);
    if (guardado) text("Usar Face ID", f.x + f.w / 2, f.y + f.h / 2);
    else text((face.activar ? "☑" : "☐") + "  Usar Face ID la próxima vez", f.x + f.w / 2, f.y + f.h / 2);
  }
  textAlign(LEFT, CENTER);
}

function pressPinDueno(mx, my) {
  if (my < PIN_Y) { pinDueno = null; return; }
  if (pinModo !== "reinicio" && enRect(mx, my, PIN_FACE)) {
    if (faceIdGuardado()) { const modo = pinModo; pinDueno = null; entrarDueno(modo); }
    else if (face.disponible) face.activar = !face.activar;
    return;
  }
  if (enRect(mx, my, PIN_ENTRAR)) { verificarPinDueno(); return; }
  for (const t of pinTeclas) {
    if (enRect(mx, my, t)) {
      if (t.label === "SALIR")  pinDueno = null;
      else if (t.label === "<") { pinDueno = pinDueno.slice(0, -1); pinError = ""; }
      else                      escribirPin(t.label);
      return;
    }
  }
}

    for (let c = 0; c < 3; c++) {

  }

  botonSiguiente     = new Button(50, 1018, 600, 92, "SIGUIENTE", 31);
  botonCerrarTeclado = new Button(550, 838, 100, 86, "×", 34);
}

function tecladoAbierto() {
  return pantalla === 1 && activeBoxIndex >= 0;
}

function dibujarTeclado() {

  const caja = cajas[activeBoxIndex];

  // Oscurecer todo lo de arriba (incluye la franja del offset)
  noStroke();
  fill(0, 105);
  rect(0, -OFFSET_Y - dyOverlay - 10, BASE_W, TEC_Y + OFFSET_Y + dyOverlay + 10);

  rect(-20, TEC_Y, BASE_W + 40, 4000, 30);

  textSize(30);
  text(postres[caja.producto], 50, 865);

  fill(verde);
  textSize(25);

  fill(caja.text === "" ? color('#A5AAA5') : texto);
  textSize(52);
  text(caja.text === "" ? "0" : caja.text, 50, 965);

  // Cerrar
  noStroke();
  fill(botonCerrarTeclado.isOver(mouseX, mouseY - OFFSET_Y - dyOverlay) ? '#E6EAE6' : '#F2F4F2');
  rect(botonCerrarTeclado.x, botonCerrarTeclado.y,
       botonCerrarTeclado.w, botonCerrarTeclado.h, 18);
  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(36);
  text("×", botonCerrarTeclado.x + botonCerrarTeclado.w/2,
                 botonCerrarTeclado.y + botonCerrarTeclado.h/2);

    fill(enRect(mouseX, mouseY - OFFSET_Y, t) ? '#E6EAE6' : '#F2F4F2');
