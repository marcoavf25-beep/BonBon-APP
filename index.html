<div id="sketch-holder"></div>

<script>
// ============================================================
//  CONTROL DE VENTAS - BON BONNE
//  Perfiles: CEO / Repartidor 1
// ============================================================

const BASE_W = 700;
const BASE_H = 850;

// ---------- COLORES ----------
let fondo, blanco, texto, textoSecundario, verde, verdeHover, borde, rojo, rojoHover;

// ---------- PANTALLAS ----------
// 0 = seleccion de perfil
// 1 = captura de ventas
// 2 = resultados CEO
// 3 = corte Repartidor 1
let pantalla = 0;

// ---------- PERFIL ----------
let rol = "CEO";   // "CEO" o "Repartidor 1"

// ---------- CONFIGURACION ----------
const GASOLINA = 100;
const LUZ = 100;
const AHORRO = 200;

const COMISION_REPARTIDOR = 0.33;  // 33% de la venta
const CUOTA_REPARTIDOR = 40;       // mas $40 fijos

// ---------- POSTRES ----------
const postres = ["Carlota", "Pay de Queso", "Flan Napolitano", "Tiramisu"];
const precios = [50, 65, 65, 100];
const costos = [19, 23, 16.5, 32];

// ---------- INPUTS ----------
let inputs = [];
let activeBoxIndex = -1;

// ---------- RESULTADOS ----------
let unidades = [0, 0, 0, 0];
let totalPostres = 0;
let capitalVendido = 0;
let costoProduccion = 0;
let profit = 0;
let postreMasVendido = "-";
let cantidadMayor = 0;

// Repartidor
let baseComision = 0;
let pagoRepartidor = 0;
let profitRepartidor = 0;

// ---------- BOTONES ----------
let botonCEO, botonRepartidor;
let botonCalcular, botonRegresar, botonAtras;

// ---------- TECLADO EN PANTALLA ----------
let teclas = [];
let botonSiguiente, botonCerrarTeclado;

// ============================================================
// SETUP
// ============================================================

function setup() {
  let cnv = createCanvas(BASE_W, BASE_H);
  document.getElementById('sketch-holder').appendChild(cnv.elt);
  smooth();

  fondo = color('#F5F6F4');
  blanco = color('#FFFFFF');
  texto = color('#252925');
  textoSecundario = color('#777C77');
  verde = color('#4F765F');
  verdeHover = color('#608A70');
  borde = color('#DDE2DD');
  rojo = color('#C20034');
  rojoHover = color('#D41A48');

  for (let i = 0; i < 4; i++) {
    inputs[i] = new TextBox(430, 235 + i * 105, 150, 58, i);
  }

  botonCEO = new BigButton(110, 380, 480, 112,
    "CEO", "Reporte completo con gastos y ganancia");

  botonRepartidor = new BigButton(110, 520, 480, 112,
    "Repartidor 1", "Corte de venta y pago del repartidor");

  botonCalcular = new Button(100, 690, 500, 65, "CALCULAR");
  botonRegresar = new Button(45, 770, 190, 55, "← REGRESAR");
  botonAtras = new Button(45, 42, 62, 48, "←");

  construirTeclado();

  updateCanvasSize();
}

function windowResized() { updateCanvasSize(); }

function updateCanvasSize() {
  let s = Math.min(windowWidth / BASE_W, windowHeight / BASE_H, 1);
  let cnvElt = document.querySelector('#sketch-holder canvas');
  if (cnvElt) {
    cnvElt.style.width = (BASE_W * s) + 'px';
    cnvElt.style.height = (BASE_H * s) + 'px';
  }
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(fondo);

  if (pantalla === 0) {
    pantallaPerfil();
  } else if (pantalla === 1) {
    pantallaVentas();
  } else if (pantalla === 2) {
    pantallaResultadosCEO();
  } else {
    pantallaResultadosRepartidor();
  }

  if (tecladoAbierto()) dibujarTeclado();
}

// ============================================================
// PANTALLA 0 - SELECCION DE PERFIL
// ============================================================

function pantallaPerfil() {

  // Marca
  fill(rojo);
  textAlign(CENTER, CENTER);
  textSize(15);
  text("BON BONNE", 350, 220);

  fill(texto);
  textSize(40);
  text("Control de Ventas", 350, 270);

  fill(textoSecundario);
  textSize(16);
  text("Selecciona tu perfil para comenzar", 350, 313);

  textAlign(LEFT, CENTER);

  botonCEO.display();
  botonRepartidor.display();

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(12);
  text("Los precios de venta y costos están configurados en el sistema", 350, 700);
  textAlign(LEFT, CENTER);
}

// ============================================================
// PANTALLA 1 - CAPTURA DE VENTAS
// ============================================================

function pantallaVentas() {

  botonAtras.display();

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(30);
  text("Control de Ventas", 127, 58);

  fill(textoSecundario);
  textSize(14);
  text(rol + " · Ingresa las unidades vendidas de hoy", 129, 90);

  fill(blanco);
  noStroke();
  rect(45, 145, 610, 485, 20);

  fill(textoSecundario);
  textSize(13);
  text("POSTRE", 80, 180);
  text("PRECIO", 280, 180);
  text("UNIDADES", 450, 180);

  stroke(borde);
  strokeWeight(1);
  line(75, 200, 625, 200);
  noStroke();

  for (let i = 0; i < 4; i++) {
    let y = 235 + i * 105;

    fill(texto);
    textSize(18);
    text(postres[i], 80, y + 29);

    fill(textoSecundario);
    textSize(16);
    text("$" + formato(precios[i]), 280, y + 29);

    inputs[i].display();
  }

  botonCalcular.display();

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(12);
  text("Toca un campo para capturar las unidades", 350, 805);
  textAlign(LEFT, CENTER);
}

// ============================================================
// PANTALLA 2 - RESULTADOS CEO
// ============================================================

function pantallaResultadosCEO() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(34);
  text("Resumen del Día", 50, 65);

  fill(textoSecundario);
  textSize(15);
  text("Reporte completo · CEO", 52, 98);

  fill(blanco);
  noStroke();
  rect(40, 130, 620, 220, 20);

  fill(textoSecundario);
  textSize(13);
  text("TOTAL DE POSTRES VENDIDOS", 70, 165);

  fill(texto);
  textSize(32);
  text(totalPostres + " unidades", 70, 205);

  fill(textoSecundario);
  textSize(13);
  text("CAPITAL VENDIDO", 390, 165);

  fill(verde);
  textSize(32);
  text("$" + formato(capitalVendido), 390, 205);

  stroke(borde);
  line(70, 235, 630, 235);
  noStroke();

  fill(textoSecundario);
  textSize(13);
  text("POSTRE MÁS VENDIDO", 70, 275);

  fill(texto);
  textSize(21);
  text(postreMasVendido, 70, 308);

  fill(textoSecundario);
  textSize(14);
  text(cantidadMayor + " unidades", 390, 308);

  // ---------- GASTOS ----------
  fill(blanco);
  rect(40, 375, 620, 280, 20);

  fill(texto);
  textSize(21);
  text("Cálculo de Gastos", 70, 415);

  filaGasto("Costos de producción", "$" + formato(costoProduccion), 455);
  filaGasto("Gasolina", "$" + formato(GASOLINA), 495);
  filaGasto("Luz", "$" + formato(LUZ), 535);
  filaGasto("Ahorro", "$" + formato(AHORRO), 575);

  stroke(borde);
  line(70, 600, 630, 600);
  noStroke();

  // ---------- PROFIT ----------
  fill(verde);
  rect(40, 675, 620, 80, 20);

  fill(blanco);
  textSize(14);
  text("GANANCIA TOTAL (PROFIT)", 70, 703);

  textSize(30);
  text("$" + formato(profit), 70, 735);

  botonRegresar.display();
}

// ============================================================
// PANTALLA 3 - CORTE REPARTIDOR 1
// ============================================================

function pantallaResultadosRepartidor() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(34);
  text("Venta Repartidor 1", 50, 65);

  fill(textoSecundario);
  textSize(15);
  text("Corte del día", 52, 98);

  // ---------- VENTA ----------
  fill(blanco);
  noStroke();
  rect(40, 130, 620, 160, 20);

  fill(textoSecundario);
  textSize(13);
  text("MONTO VENDIDO", 70, 165);

  fill(verde);
  textSize(32);
  text("$" + formato(capitalVendido), 70, 205);

  fill(textoSecundario);
  textSize(13);
  text(totalPostres + " postres vendidos", 70, 245);

  fill(textoSecundario);
  textSize(13);
  text("POSTRE MÁS VENDIDO", 390, 165);

  fill(texto);
  textSize(21);
  text(postreMasVendido, 390, 202);

  fill(textoSecundario);
  textSize(14);
  text(cantidadMayor + " unidades", 390, 235);

  // ---------- DESGLOSE ----------
  fill(blanco);
  rect(40, 312, 620, 215, 20);

  fill(texto);
  textSize(21);
  text("Pago al repartidor", 70, 352);

  filaGasto("Comisión (33% de la venta)", "$" + formato(baseComision), 397);
  filaGasto("Cuota fija", "$" + formato(CUOTA_REPARTIDOR), 437);

  stroke(borde);
  line(70, 462, 630, 462);
  noStroke();

  filaGasto("Gasto de postres (reinversión)", "$" + formato(costoProduccion), 492);

  // ---------- PAGO ----------
  fill(rojo);
  rect(40, 549, 620, 88, 20);

  fill(blanco);
  textSize(14);
  text("A ENTREGAR AL REPARTIDOR 1", 70, 578);

  textSize(30);
  text("$" + formato(pagoRepartidor), 70, 611);

  // ---------- PROFIT ----------
  fill(verde);
  rect(40, 657, 620, 88, 20);

  fill(blanco);
  textSize(14);
  text("GANANCIA TOTAL (PROFIT)", 70, 686);

  textSize(30);
  text("$" + formato(profitRepartidor), 70, 719);

  botonRegresar.display();
}

// ---------- Fila etiqueta / valor ----------
function filaGasto(etiqueta, valor, y) {
  fill(textoSecundario);
  textSize(14);
  text(etiqueta, 70, y);

  fill(texto);
  textSize(18);
  textAlign(RIGHT, CENTER);
  text(valor, 630, y);
  textAlign(LEFT, CENTER);
}

// ============================================================
// CALCULOS
// ============================================================

function calcularResultados() {

  totalPostres = 0;
  capitalVendido = 0;
  costoProduccion = 0;
  cantidadMayor = 0;
  postreMasVendido = "-";

  for (let i = 0; i < 4; i++) {

    let valor = inputs[i].getText();
    let parsed = parseInt(valor, 10);

    if (valor === "" || isNaN(parsed) || parsed < 0) {
      parsed = 0;
    }

    unidades[i] = parsed;

    totalPostres += unidades[i];
    capitalVendido += unidades[i] * precios[i];
    costoProduccion += unidades[i] * costos[i];

    if (unidades[i] > cantidadMayor) {
      cantidadMayor = unidades[i];
      postreMasVendido = postres[i];
    }
  }

  // ---- CEO ----
  // Venta - costos de producción - gasolina - luz
  profit = capitalVendido - costoProduccion - GASOLINA - LUZ;

  // ---- Repartidor 1 ----
  // Pago = 33% de la venta + $40
  baseComision = capitalVendido * COMISION_REPARTIDOR;
  pagoRepartidor = baseComision + CUOTA_REPARTIDOR;

  // Profit = venta - pago al repartidor - reinversión (costo de postres)
  profitRepartidor = capitalVendido - pagoRepartidor - costoProduccion;

  pantalla = (rol === "CEO") ? 2 : 3;
  cerrarTeclado();
}

// ============================================================
// NAVEGACION
// ============================================================

function cerrarTeclado() {
  for (let i = 0; i < 4; i++) inputs[i].active = false;
  activeBoxIndex = -1;
}

function irAPerfil() {
  pantalla = 0;
  cerrarTeclado();
}

function irAVentas(nuevoRol) {
  if (nuevoRol) rol = nuevoRol;
  pantalla = 1;
  cerrarTeclado();
}

// ============================================================
// MOUSE / TOUCH
// ============================================================

function mousePressed() { handlePress(mouseX, mouseY); }

function touchStarted() {
  if (touches.length > 0) handlePress(touches[0].x, touches[0].y);
  else handlePress(mouseX, mouseY);
  return false;
}

function handlePress(mx, my) {

  // El teclado en pantalla captura todos los toques mientras esta abierto
  if (tecladoAbierto()) { pressTeclado(mx, my); return; }

  if (pantalla === 0) {

    if (botonCEO.isOver(mx, my)) irAVentas("CEO");
    else if (botonRepartidor.isOver(mx, my)) irAVentas("Repartidor 1");

  } else if (pantalla === 1) {

    if (botonAtras.isOver(mx, my)) { irAPerfil(); return; }

    for (let i = 0; i < 4; i++) inputs[i].pressedAt(mx, my);

    if (botonCalcular.isOver(mx, my)) calcularResultados();

  } else {

    if (botonRegresar.isOver(mx, my)) irAVentas();
  }
}

// ============================================================
// TECLADO
// ============================================================

function keyPressed() {

  if (pantalla !== 1) return;

  if (tecladoAbierto()) {

    if (key >= '0' && key <= '9') { escribirDigito(key); return false; }
    if (keyCode === BACKSPACE)    { borrarUltimo();      return false; }
    if (keyCode === DELETE)       { limpiarCampo();      return false; }
    if (keyCode === TAB)          { siguienteCampo();    return false; }
    if (keyCode === ESCAPE)       { cerrarTeclado();     return false; }

    if (keyCode === ENTER || keyCode === RETURN) {
      if (activeBoxIndex < 3) siguienteCampo();
      else { cerrarTeclado(); calcularResultados(); }
      return false;
    }

    return false;
  }

  if (keyCode === ENTER || keyCode === RETURN) calcularResultados();
}


// ============================================================
// TECLADO NUMERICO EN PANTALLA
// (no depende del teclado del sistema, funciona igual en
//  celular y computadora)
// ============================================================

const TEC_Y = 430;

function construirTeclado() {
  const labels = [["1","2","3"], ["4","5","6"], ["7","8","9"], ["C","0","<"]];
  const xs = [40, 250, 460];
  const ys = [598, 660, 722, 784];
  const w = 200, h = 56;

  teclas = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 3; c++) {
      teclas.push({ label: labels[r][c], x: xs[c], y: ys[r], w: w, h: h });
    }
  }

  botonSiguiente = new Button(40, 534, 620, 52, "SIGUIENTE");
  botonCerrarTeclado = new Button(596, 452, 60, 52, "X");
}

function tecladoAbierto() {
  return pantalla === 1 && activeBoxIndex >= 0;
}

function dibujarTeclado() {

  const box = inputs[activeBoxIndex];

  // Fondo oscuro sobre la pantalla
  noStroke();
  fill(0, 105);
  rect(0, 0, BASE_W, TEC_Y);

  // Panel
  fill(blanco);
  rect(-20, TEC_Y, BASE_W + 40, 480, 26);

  // Encabezado: que postre se esta capturando
  fill(textoSecundario);
  textAlign(LEFT, CENTER);
  textSize(15);
  text(postres[activeBoxIndex], 40, 468);

  fill(box.text === "" ? color('#A5AAA5') : texto);
  textSize(36);
  text(box.text === "" ? "0" : box.text, 40, 506);

  fill(textoSecundario);
  textSize(14);
  textAlign(RIGHT, CENTER);
  text("unidades", 560, 512);
  textAlign(LEFT, CENTER);

  // Cerrar
  const cerrarHover = botonCerrarTeclado.isOver(mouseX, mouseY);
  noStroke();
  fill(cerrarHover ? '#ECEFEC' : '#F2F4F2');
  rect(botonCerrarTeclado.x, botonCerrarTeclado.y,
       botonCerrarTeclado.w, botonCerrarTeclado.h, 14);
  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(20);
  text("\u00d7", botonCerrarTeclado.x + botonCerrarTeclado.w/2,
                  botonCerrarTeclado.y + botonCerrarTeclado.h/2);
  textAlign(LEFT, CENTER);

  // Boton principal
  botonSiguiente.label = (activeBoxIndex < 3) ? "SIGUIENTE \u2192" : "LISTO";
  botonSiguiente.display();

  // Teclas
  for (const t of teclas) {
    const hover = enRect(mouseX, mouseY, t);

    noStroke();
    fill(hover ? '#E6EAE6' : '#F2F4F2');
    rect(t.x, t.y, t.w, t.h, 14);

    textAlign(CENTER, CENTER);

    if (t.label === "<") {
      fill(textoSecundario);
      textSize(26);
      text("\u2190", t.x + t.w/2, t.y + t.h/2);
    } else if (t.label === "C") {
      fill(textoSecundario);
      textSize(17);
      text("LIMPIAR", t.x + t.w/2, t.y + t.h/2);
    } else {
      fill(texto);
      textSize(26);
      text(t.label, t.x + t.w/2, t.y + t.h/2);
    }

    textAlign(LEFT, CENTER);
  }
}

function enRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

// ---------- Escritura ----------

function escribirDigito(d) {
  if (activeBoxIndex < 0) return;
  const box = inputs[activeBoxIndex];
  if (box.text.length < 4) box.text += d;
}

function borrarUltimo() {
  if (activeBoxIndex < 0) return;
  const box = inputs[activeBoxIndex];
  box.text = box.text.slice(0, -1);
}

function limpiarCampo() {
  if (activeBoxIndex < 0) return;
  inputs[activeBoxIndex].text = "";
}

function siguienteCampo() {
  if (activeBoxIndex < 3) {
    inputs[activeBoxIndex + 1].activate();
  } else {
    cerrarTeclado();
  }
}

// ---------- Clicks dentro del teclado ----------

function pressTeclado(mx, my) {

  if (botonCerrarTeclado.isOver(mx, my)) { cerrarTeclado(); return; }
  if (botonSiguiente.isOver(mx, my))     { siguienteCampo(); return; }

  for (const t of teclas) {
    if (enRect(mx, my, t)) {
      if (t.label === "C") limpiarCampo();
      else if (t.label === "<") borrarUltimo();
      else escribirDigito(t.label);
      return;
    }
  }

  // Toque arriba del panel = cerrar
  if (my < TEC_Y) cerrarTeclado();
}

// ============================================================
// FORMATO DE DINERO
// ============================================================

function formato(numero) {
  return nf(numero, 0, 2);
}

// ============================================================
// CLASE TEXTBOX
// ============================================================

class TextBox {

  constructor(x, y, w, h, index) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.index = index;
    this.text = "";
    this.active = false;
  }

  display() {
    if (this.active) {
      fill('#F0F6F2'); stroke(verde); strokeWeight(2);
    } else {
      fill('#F7F8F7'); stroke(borde); strokeWeight(1);
    }
    rect(this.x, this.y, this.w, this.h, 12);

    textAlign(CENTER, CENTER);
    textSize(20);

    if (this.text === "") {
      fill('#A5AAA5');
      text("0", this.x + this.w/2, this.y + this.h/2);
    } else {
      fill(texto);
      text(this.text, this.x + this.w/2, this.y + this.h/2);
    }

    textAlign(LEFT, CENTER);
    noStroke();
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  pressedAt(mx, my) {
    if (this.isOver(mx, my)) this.activate();
    else if (this.active) this.active = false;
  }

  activate() {
    for (let i = 0; i < inputs.length; i++) inputs[i].active = false;
    this.active = true;
    activeBoxIndex = this.index;
  }

  getText() { return this.text; }
}

// ============================================================
// CLASE BUTTON
// ============================================================

class Button {

  constructor(x, y, w, h, label) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
  }

  display() {
    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 20);
    rect(this.x, this.y + 4, this.w, this.h, 14);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 14);

    fill(blanco);
    textAlign(CENTER, CENTER);
    textSize(16);
    text(this.label, this.x + this.w/2, this.y + this.h/2);
    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}

// ============================================================
// CLASE BIGBUTTON (perfil)
// ============================================================

class BigButton {

  constructor(x, y, w, h, label, sublabel) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.sublabel = sublabel;
  }

  display() {
    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 22);
    rect(this.x, this.y + 5, this.w, this.h, 20);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 20);

    // Flecha
    fill(255, 150);
    textAlign(RIGHT, CENTER);
    textSize(24);
    text("→", this.x + this.w - 32, this.y + this.h/2 - 2);

    fill(blanco);
    textAlign(LEFT, CENTER);
    textSize(26);
    text(this.label, this.x + 34, this.y + this.h/2 - 14);

    fill(255, 185);
    textSize(14);
    text(this.sublabel, this.x + 34, this.y + this.h/2 + 18);

    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}
