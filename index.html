  verde = color('#4F765F');
  verdeHover = color('#608A70');
  borde = color('#DDE2DD');
  rojo = color('#C65C5C');

  for (let i = 0; i < 4; i++) {
    inputs[i] = new TextBox(430, 235 + i * 105, 150, 58, i);
  }

  botonCalcular = new Button(100, 690, 500, 65, "CALCULAR");
  botonRegresar = new Button(50, 760, 180, 55, "← REGRESAR");

  hiddenInput = document.getElementById('hiddenInput');
  hiddenInput.addEventListener('input', onHiddenInput);
  hiddenInput.addEventListener('blur', onHiddenBlur);

  updateCanvasSize();
}

function windowResized() {
  updateCanvasSize();
}

function updateCanvasSize() {
  let scaleFactor = Math.min(windowWidth / BASE_W, windowHeight / BASE_H, 1);
  let w = BASE_W * scaleFactor;
  let h = BASE_H * scaleFactor;
  let cnvElt = document.querySelector('#sketch-holder canvas');
  if (cnvElt) {
    cnvElt.style.width = w + 'px';
    cnvElt.style.height = h + 'px';
  }
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(fondo);

  if (pantalla === 0) {
    pantallaVentas();
  } else {
    pantallaResultados();
  }
}

// ============================================================
// CÁLCULOS
// ============================================================

function calcularResultados() {

  totalPostres = 0;
  capitalVendido = 0;
  costoProduccion = 0;
  cantidadMayor = 0;
  postreMasVendido = "-";

  for (let i = 0; i < 4; i++) {

    let valor = inputs[i].getText();
    let parsed = parseInt(valor, 10);

    if (valor === "" || isNaN(parsed)) {
      parsed = 0;
    }
    if (parsed < 0) {
      parsed = 0;
    }

    unidades[i] = parsed;

    totalPostres += unidades[i];
    capitalVendido += unidades[i] * precios[i];
    costoProduccion += unidades[i] * costos[i];

    if (unidades[i] > cantidadMayor) {
      cantidadMayor = unidades[i];
      postreMasVendido = postres[i];
    }
  }

  // Profit:
  // Capital vendido
  // - costos de producción
  // - gasolina
  // - luz

  profit = capitalVendido - costoProduccion - 100 - 100;

  pantalla = 1;
}

// ============================================================
// MOUSE / TOUCH
// ============================================================

function mousePressed() {
  handlePress(mouseX, mouseY);
}

function touchStarted() {
  if (touches.length > 0) {
    handlePress(touches[0].x, touches[0].y);
  } else {
    handlePress(mouseX, mouseY);
  }
  return false; // evita el zoom/scroll y el mousedown fantasma
}

function handlePress(mx, my) {

  if (pantalla === 0) {

    for (let i = 0; i < 4; i++) {
      inputs[i].pressedAt(mx, my);
    }

    if (botonCalcular.isOver(mx, my)) {
      calcularResultados();
    }

  } else {

    if (botonRegresar.isOver(mx, my)) {

      pantalla = 0;

      for (let i = 0; i < 4; i++) {
        inputs[i].active = false;
      }
      activeBoxIndex = -1;
      hiddenInput.blur();
    }
  }
}

// ============================================================
// TECLADO (Enter = calcular, físico o de escritorio)
// ============================================================

function keyPressed() {
  if (pantalla === 0 && (keyCode === ENTER || keyCode === RETURN)) {
    calcularResultados();
  }
}

// ============================================================
// INPUT OCULTO -> sincroniza con el TextBox activo
// (así aparece el teclado numérico en el celular)
// ============================================================

function onHiddenInput(e) {
  if (activeBoxIndex < 0) return;
  let v = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
  e.target.value = v;
  inputs[activeBoxIndex].text = v;
}

function onHiddenBlur() {
  if (activeBoxIndex >= 0) {
    inputs[activeBoxIndex].active = false;
  }
  activeBoxIndex = -1;
}

// ============================================================
// FORMATO DE DINERO
// ============================================================

function formato(numero) {
  return nf(numero, 0, 2);
}

// ============================================================
// CLASE TEXTBOX
// ============================================================

class TextBox {

  constructor(x, y, w, h, index) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.index = index;
    this.text = "";
    this.active = false;
  }

  display() {

    if (this.active) {
      fill('#F0F6F2');
      stroke(verde);
      strokeWeight(2);
    } else {
      fill('#F7F8F7');
      stroke(borde);
      strokeWeight(1);
    }

    rect(this.x, this.y, this.w, this.h, 12);

    textAlign(CENTER, CENTER);
    textSize(20);

    if (this.text === "") {
      fill('#A5AAA5');
      text("0", this.x + this.w / 2, this.y + this.h / 2);
    } else {
      fill(texto);
      text(this.text, this.x + this.w / 2, this.y + this.h / 2);
    }

    textAlign(LEFT, CENTER);
    noStroke();
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  pressedAt(mx, my) {
    if (this.isOver(mx, my)) {
      this.activate();
    } else if (this.active) {
      this.active = false;
    }
  }

  activate() {
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].active = false;
    }
    this.active = true;
    activeBoxIndex = this.index;
    hiddenInput.value = this.text;
    hiddenInput.focus();
  }

  getText() {
    return this.text;
  }
}

// ============================================================
// CLASE BUTTON
// ============================================================

class Button {

  constructor(x, y, w, h, label) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.label = label;
  }

  display() {

    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 20);
    rect(this.x, this.y + 4, this.w, this.h, 14);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 14);

    fill(blanco);
    textAlign(CENTER, CENTER);
    textSize(16);
    text(this.label, this.x + this.w / 2, this.y + this.h / 2);
    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}
