<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Ventas - BON BONNE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #F5F6F4;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #sketch-holder {
    line-height: 0;
  }
  #hiddenInput {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    height: 0;
    width: 0;
    border: none;
    padding: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="sketch-holder"></div>
<input id="hiddenInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />

<script>
// ============================================================
//  CONTROL DE VENTAS - BON BONNE
//  Versión web (p5.js) portada desde Processing
// ============================================================

const BASE_W = 700;
const BASE_H = 850;

// ---------- COLORES ----------
let fondo, blanco, texto, textoSecundario, verde, verdeHover, borde, rojo;

// ---------- PANTALLAS ----------
let pantalla = 0; // 0 = ventas, 1 = resultados

// ---------- POSTRES ----------
const postres = ["Carlota", "Pay de Queso", "Flan Napolitano", "Tiramisu"];
const precios = [50, 65, 65, 100];
const costos = [19, 23, 16.5, 32];

// ---------- INPUTS ----------
let inputs = [];
let activeBoxIndex = -1;

// ---------- RESULTADOS ----------
let unidades = [0, 0, 0, 0];
let totalPostres = 0;
let capitalVendido = 0;
let costoProduccion = 0;
let profit = 0;
let postreMasVendido = "-";
let cantidadMayor = 0;

// ---------- BOTONES ----------
let botonCalcular;
let botonRegresar;

// ---------- INPUT OCULTO (teclado móvil) ----------
let hiddenInput;

// ============================================================
// SETUP
// ============================================================

function setup() {
  let cnv = createCanvas(BASE_W, BASE_H);
  document.getElementById('sketch-holder').appendChild(cnv.elt);
  smooth();

  fondo = color('#F5F6F4');
  blanco = color('#FFFFFF');
  texto = color('#252925');
  textoSecundario = color('#777C77');
  verde = color('#4F765F');
  verdeHover = color('#608A70');
  borde = color('#DDE2DD');
  rojo = color('#C65C5C');

  for (let i = 0; i < 4; i++) {
    inputs[i] = new TextBox(430, 235 + i * 105, 150, 58, i);
  }

  botonCalcular = new Button(100, 690, 500, 65, "CALCULAR");
  botonRegresar = new Button(50, 760, 180, 55, "← REGRESAR");

  hiddenInput = document.getElementById('hiddenInput');
  hiddenInput.addEventListener('input', onHiddenInput);
  hiddenInput.addEventListener('blur', onHiddenBlur);

  updateCanvasSize();
}

function windowResized() {
  updateCanvasSize();
}

function updateCanvasSize() {
  let scaleFactor = Math.min(windowWidth / BASE_W, windowHeight / BASE_H, 1);
  let w = BASE_W * scaleFactor;
  let h = BASE_H * scaleFactor;
  let cnvElt = document.querySelector('#sketch-holder canvas');
  if (cnvElt) {
    cnvElt.style.width = w + 'px';
    cnvElt.style.height = h + 'px';
  }
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(fondo);

  if (pantalla === 0) {
    pantallaVentas();
  } else {
    pantallaResultados();
  }
}

// ============================================================
// PANTALLA 1 - VENTAS
// ============================================================

function pantallaVentas() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(34);
  text("Control de Ventas", 55, 70);

  fill(textoSecundario);
  textSize(16);
  text("Ingresa las unidades vendidas de hoy", 57, 105);

  fill(blanco);
  noStroke();
  rect(45, 145, 610, 485, 20);

  fill(textoSecundario);
  textSize(13);
  text("POSTRE", 80, 180);
  text("PRECIO", 280, 180);
  text("UNIDADES", 450, 180);

  stroke(borde);
  strokeWeight(1);
  line(75, 200, 625, 200);
  noStroke();

  for (let i = 0; i < 4; i++) {
    let y = 235 + i * 105;

    fill(texto);
    textSize(18);
    text(postres[i], 80, y + 29);

    fill(textoSecundario);
    textSize(16);
    text("$" + formato(precios[i]), 280, y + 29);

    inputs[i].display();
  }

  botonCalcular.display();

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(12);
  text("Los precios de venta y costos están configurados en el sistema", 350, 805);

  textAlign(LEFT, CENTER);
}

// ============================================================
// PANTALLA 2 - RESULTADOS
// ============================================================

function pantallaResultados() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(34);
  text("Resumen del Día", 50, 65);

  fill(textoSecundario);
  textSize(15);
  text("Resultados de las ventas de hoy", 52, 98);

  fill(blanco);
  noStroke();
  rect(40, 130, 620, 220, 20);

  fill(textoSecundario);
  textSize(13);
  text("TOTAL DE POSTRES VENDIDOS", 70, 165);

  fill(texto);
  textSize(32);
  text(totalPostres + " unidades", 70, 205);

  fill(textoSecundario);
  textSize(13);
  text("CAPITAL VENDIDO", 390, 165);

  fill(verde);
  textSize(32);
  text("$" + formato(capitalVendido), 390, 205);

  stroke(borde);
  line(70, 235, 630, 235);
  noStroke();

  fill(textoSecundario);
  textSize(13);
  text("POSTRE MÁS VENDIDO", 70, 275);

  fill(texto);
  textSize(21);
  text(postreMasVendido, 70, 308);

  fill(textoSecundario);
  textSize(14);
  text(cantidadMayor + " unidades", 390, 308);

  fill(blanco);
  rect(40, 375, 620, 280, 20);

  fill(texto);
  textSize(21);
  text("Cálculo de Gastos", 70, 415);

  fill(textoSecundario);
  textSize(14);
  text("Costos de producción", 70, 455);

  fill(texto);
  textSize(18);
  text("$" + formato(costoProduccion), 535, 455);

  fill(textoSecundario);
  textSize(14);
  text("Gasolina", 70, 495);

  fill(texto);
  textSize(18);
  text("$100.00", 535, 495);

  fill(textoSecundario);
  textSize(14);
  text("Luz", 70, 535);

  fill(texto);
  textSize(18);
  text("$100.00", 535, 535);

  fill(textoSecundario);
  textSize(14);
  text("Ahorro", 70, 575);

  fill(texto);
  textSize(18);
  text("$200.00", 535, 575);

  stroke(borde);
  line(70, 600, 630, 600);
  noStroke();

  fill(verde);
  rect(40, 675, 620, 90, 20);

  fill(blanco);
  textSize(14);
  text("GANANCIA TOTAL (PROFIT)", 70, 705);

  textSize(30);
  text("$" + formato(profit), 70, 740);

  botonRegresar.display();
}

// ============================================================
// CÁLCULOS
// ============================================================

function calcularResultados() {

  totalPostres = 0;
  capitalVendido = 0;
  costoProduccion = 0;
  cantidadMayor = 0;
  postreMasVendido = "-";

  for (let i = 0; i < 4; i++) {

    let valor = inputs[i].getText();
    let parsed = parseInt(valor, 10);

    if (valor === "" || isNaN(parsed)) {
      parsed = 0;
    }
    if (parsed < 0) {
      parsed = 0;
    }

    unidades[i] = parsed;

    totalPostres += unidades[i];
    capitalVendido += unidades[i] * precios[i];
    costoProduccion += unidades[i] * costos[i];

    if (unidades[i] > cantidadMayor) {
      cantidadMayor = unidades[i];
      postreMasVendido = postres[i];
    }
  }

  // Profit:
  // Capital vendido
  // - costos de producción
  // - gasolina
  // - luz

  profit = capitalVendido - costoProduccion - 100 - 100;

  pantalla = 1;
}

// ============================================================
// MOUSE / TOUCH
// ============================================================

function mousePressed() {
  handlePress(mouseX, mouseY);
}

function touchStarted() {
  if (touches.length > 0) {
    handlePress(touches[0].x, touches[0].y);
  } else {
    handlePress(mouseX, mouseY);
  }
  return false; // evita el zoom/scroll y el mousedown fantasma
}

function handlePress(mx, my) {

  if (pantalla === 0) {

    for (let i = 0; i < 4; i++) {
      inputs[i].pressedAt(mx, my);
    }

    if (botonCalcular.isOver(mx, my)) {
      calcularResultados();
    }

  } else {

    if (botonRegresar.isOver(mx, my)) {

      pantalla = 0;

      for (let i = 0; i < 4; i++) {
        inputs[i].active = false;
      }
      activeBoxIndex = -1;
      hiddenInput.blur();
    }
  }
}

// ============================================================
// TECLADO (Enter = calcular, físico o de escritorio)
// ============================================================

function keyPressed() {
  if (pantalla === 0 && (keyCode === ENTER || keyCode === RETURN)) {
    calcularResultados();
  }
}

// ============================================================
// INPUT OCULTO -> sincroniza con el TextBox activo
// (así aparece el teclado numérico en el celular)
// ============================================================

function onHiddenInput(e) {
  if (activeBoxIndex < 0) return;
  let v = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
  e.target.value = v;
  inputs[activeBoxIndex].text = v;
}

function onHiddenBlur() {
  if (activeBoxIndex >= 0) {
    inputs[activeBoxIndex].active = false;
  }
  activeBoxIndex = -1;
}

// ============================================================
// FORMATO DE DINERO
// ============================================================

function formato(numero) {
  return nf(numero, 0, 2);
}

// ============================================================
// CLASE TEXTBOX
// ============================================================

class TextBox {

  constructor(x, y, w, h, index) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.index = index;
    this.text = "";
    this.active = false;
  }

  display() {

    if (this.active) {
      fill('#F0F6F2');
      stroke(verde);
      strokeWeight(2);
    } else {
      fill('#F7F8F7');
      stroke(borde);
      strokeWeight(1);
    }

    rect(this.x, this.y, this.w, this.h, 12);

    textAlign(CENTER, CENTER);
    textSize(20);

    if (this.text === "") {
      fill('#A5AAA5');
      text("0", this.x + this.w / 2, this.y + this.h / 2);
    } else {
      fill(texto);
      text(this.text, this.x + this.w / 2, this.y + this.h / 2);
    }

    textAlign(LEFT, CENTER);
    noStroke();
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  pressedAt(mx, my) {
    if (this.isOver(mx, my)) {
      this.activate();
    } else if (this.active) {
      this.active = false;
    }
  }

  activate() {
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].active = false;
    }
    this.active = true;
    activeBoxIndex = this.index;
    hiddenInput.value = this.text;
    hiddenInput.focus();
  }

  getText() {
    return this.text;
  }
}

// ============================================================
// CLASE BUTTON
// ============================================================

class Button {

  constructor(x, y, w, h, label) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.label = label;
  }

  display() {

    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 20);
    rect(this.x, this.y + 4, this.w, this.h, 14);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 14);

    fill(blanco);
    textAlign(CENTER, CENTER);
    textSize(16);
    text(this.label, this.x + this.w / 2, this.y + this.h / 2);
    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}
</script>
</body>
</html>
