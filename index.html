<div id="sketch-holder"></div>

<script>
// ============================================================
//  CONTROL DE VENTAS - BON BON
//  Perfiles: CEO / Repartidor 1
//  Lienzo vertical pensado para celular
// ============================================================

const BASE_W = 700;
const BASE_H = 1400;

// ---------- COLORES ----------
let fondo, blanco, texto, textoSecundario, verde, verdeHover, borde, rojo;

// ---------- PANTALLAS ----------
// 0 = perfil | 1 = captura | 2 = resultados CEO | 3 = corte Repartidor 1
let pantalla = 0;
let rol = "CEO";

// ---------- CONFIGURACION ----------
const GASOLINA = 100;
const LUZ = 100;
const AHORRO = 200;
const COMISION_REPARTIDOR = 0.33;
const CUOTA_REPARTIDOR = 40;

// ---------- POSTRES ----------
const postres = ["Carlota", "Pay de Queso", "Flan Napolitano", "Tiramisu"];
const precios = [50, 65, 65, 100];
const costos = [19, 23, 16.5, 32];

// ---------- INPUTS ----------
let inputs = [];
let activeBoxIndex = -1;

// ---------- RESULTADOS ----------
let unidades = [0, 0, 0, 0];
let totalPostres = 0;
let capitalVendido = 0;
let costoProduccion = 0;
let profit = 0;
let postreMasVendido = "-";
let cantidadMayor = 0;
let baseComision = 0;
let pagoRepartidor = 0;
let profitRepartidor = 0;

// ---------- BOTONES ----------
let botonCEO, botonRepartidor;
let botonCalcular, botonRegresar, botonAtras;

// ---------- TECLADO ----------
let teclas = [];
let botonSiguiente, botonCerrarTeclado;
const TEC_Y = 680;

// ============================================================
// SETUP
// ============================================================

function setup() {
  let cnv = createCanvas(BASE_W, BASE_H);
  document.getElementById('sketch-holder').appendChild(cnv.elt);
  smooth();

  fondo = color('#F5F6F4');
  blanco = color('#FFFFFF');
  texto = color('#252925');
  textoSecundario = color('#777C77');
  verde = color('#4F765F');
  verdeHover = color('#608A70');
  borde = color('#DDE2DD');
  rojo = color('#C20034');

  for (let i = 0; i < 4; i++) {
    inputs[i] = new TextBox(440, 335 + i * 185, 200, 92, i);
  }

  botonCEO = new BigButton(60, 660, 580, 170,
    "CEO", "Reporte completo del día");

  botonRepartidor = new BigButton(60, 860, 580, 170,
    "Repartidor 1", "Corte y pago del repartidor");

  botonCalcular = new Button(60, 1065, 580, 100, "CALCULAR", 28);
  botonRegresar = new Button(40, 1290, 290, 92, "\u2190 REGRESAR", 26);
  botonAtras    = new Button(40, 60, 92, 78, "\u2190", 32);

  construirTeclado();
  updateCanvasSize();
}

function windowResized() { updateCanvasSize(); }

function updateCanvasSize() {
  let s = Math.min(windowWidth / BASE_W, windowHeight / BASE_H);
  let el = document.querySelector('#sketch-holder canvas');
  if (el) {
    el.style.width  = (BASE_W * s) + 'px';
    el.style.height = (BASE_H * s) + 'px';
  }
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(fondo);

  if (pantalla === 0)      pantallaPerfil();
  else if (pantalla === 1) pantallaVentas();
  else if (pantalla === 2) pantallaResultadosCEO();
  else                     pantallaResultadosRepartidor();

  if (tecladoAbierto()) dibujarTeclado();
}

// ============================================================
// PANTALLA 0 - PERFIL
// ============================================================

function pantallaPerfil() {

  fill(rojo);
  textAlign(CENTER, CENTER);
  textSize(26);
  text("BON BON", 350, 420);

  fill(texto);
  textSize(58);
  text("Control de Ventas", 350, 495);

  fill(textoSecundario);
  textSize(24);
  text("Selecciona tu perfil", 350, 555);

  textAlign(LEFT, CENTER);

  botonCEO.display();
  botonRepartidor.display();

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(19);
  text("Precios y costos configurados en el sistema", 350, 1130);
  textAlign(LEFT, CENTER);
}

// ============================================================
// PANTALLA 1 - CAPTURA
// ============================================================

function pantallaVentas() {

  botonAtras.display();

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(46);
  text("Control de Ventas", 158, 88);

  fill(textoSecundario);
  textSize(22);
  text(rol, 160, 140);

  fill(blanco);
  noStroke();
  rect(40, 205, 620, 800, 26);

  fill(textoSecundario);
  textSize(21);
  text("POSTRE", 75, 258);
  text("PRECIO", 330, 258);
  text("UNIDADES", 445, 258);

  stroke(borde);
  strokeWeight(2);
  line(70, 292, 630, 292);
  noStroke();

  for (let i = 0; i < 4; i++) {
    let y = 335 + i * 185;

    fill(texto);
    textSize(28);
    text(postres[i], 75, y + 46);

    fill(textoSecundario);
    textSize(26);
    text("$" + formato(precios[i]), 330, y + 46);

    inputs[i].display();
  }

  botonCalcular.display();

  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(20);
  text("Toca un campo para capturar las unidades", 350, 1225);
  textAlign(LEFT, CENTER);
}

// ============================================================
// PANTALLA 2 - RESULTADOS CEO
// ============================================================

function pantallaResultadosCEO() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(52);
  text("Resumen del Día", 50, 95);

  fill(textoSecundario);
  textSize(24);
  text("Reporte completo · CEO", 52, 148);

  // ---- Venta ----
  fill(blanco);
  noStroke();
  rect(40, 200, 620, 300, 26);

  fill(textoSecundario);
  textSize(20);
  text("TOTAL DE POSTRES VENDIDOS", 75, 250);

  fill(texto);
  textSize(46);
  text(totalPostres + " unidades", 75, 308);

  stroke(borde);
  strokeWeight(2);
  line(75, 355, 625, 355);
  noStroke();

  fill(textoSecundario);
  textSize(20);
  text("CAPITAL VENDIDO", 75, 400);

  fill(verde);
  textSize(46);
  text("$" + formato(capitalVendido), 75, 458);

  // ---- Mas vendido ----
  fill(blanco);
  rect(40, 525, 620, 185, 26);

  fill(textoSecundario);
  textSize(20);
  text("POSTRE MÁS VENDIDO", 75, 573);

  fill(texto);
  textSize(36);
  text(postreMasVendido, 75, 625);

  fill(textoSecundario);
  textSize(22);
  text(cantidadMayor + " unidades", 75, 672);

  // ---- Gastos ----
  fill(blanco);
  rect(40, 735, 620, 340, 26);

  fill(texto);
  textSize(32);
  text("Cálculo de Gastos", 75, 790);

  filaGasto("Costos de producción", "$" + formato(costoProduccion), 860);
  filaGasto("Gasolina", "$" + formato(GASOLINA), 920);
  filaGasto("Luz", "$" + formato(LUZ), 980);
  filaGasto("Ahorro", "$" + formato(AHORRO), 1040);

  // ---- Profit ----
  fill(verde);
  rect(40, 1105, 620, 130, 26);

  fill(blanco);
  textSize(21);
  text("GANANCIA TOTAL (PROFIT)", 75, 1150);

  textSize(46);
  text("$" + formato(profit), 75, 1200);

  botonRegresar.display();
}

// ============================================================
// PANTALLA 3 - CORTE REPARTIDOR 1
// ============================================================

function pantallaResultadosRepartidor() {

  fill(texto);
  textAlign(LEFT, CENTER);
  textSize(52);
  text("Venta Repartidor 1", 50, 95);

  fill(textoSecundario);
  textSize(24);
  text("Corte del día", 52, 148);

  // ---- Venta ----
  fill(blanco);
  noStroke();
  rect(40, 200, 620, 195, 26);

  fill(textoSecundario);
  textSize(20);
  text("MONTO VENDIDO", 75, 248);

  fill(verde);
  textSize(50);
  text("$" + formato(capitalVendido), 75, 308);

  fill(textoSecundario);
  textSize(21);
  text(totalPostres + " postres vendidos", 75, 360);

  // ---- Mas vendido ----
  fill(blanco);
  rect(40, 415, 620, 185, 26);

  fill(textoSecundario);
  textSize(20);
  text("POSTRE MÁS VENDIDO", 75, 463);

  fill(texto);
  textSize(36);
  text(postreMasVendido, 75, 515);

  fill(textoSecundario);
  textSize(22);
  text(cantidadMayor + " unidades", 75, 562);

  // ---- Desglose ----
  fill(blanco);
  rect(40, 620, 620, 330, 26);

  fill(texto);
  textSize(32);
  text("Pago al repartidor", 75, 675);

  filaGasto("Comisión (33% de la venta)", "$" + formato(baseComision), 745);
  filaGasto("Cuota fija", "$" + formato(CUOTA_REPARTIDOR), 805);

  stroke(borde);
  strokeWeight(2);
  line(75, 848, 625, 848);
  noStroke();

  filaGasto("Gasto de postres (reinversión)", "$" + formato(costoProduccion), 898);

  // ---- Pago ----
  fill(rojo);
  rect(40, 975, 620, 130, 26);

  fill(blanco);
  textSize(21);
  text("A ENTREGAR AL REPARTIDOR 1", 75, 1020);

  textSize(46);
  text("$" + formato(pagoRepartidor), 75, 1070);

  // ---- Profit ----
  fill(verde);
  rect(40, 1130, 620, 130, 26);

  fill(blanco);
  textSize(21);
  text("GANANCIA TOTAL (PROFIT)", 75, 1175);

  textSize(46);
  text("$" + formato(profitRepartidor), 75, 1225);

  botonRegresar.display();
}

// ---------- Fila etiqueta / valor ----------
function filaGasto(etiqueta, valor, y) {
  fill(textoSecundario);
  textSize(22);
  textAlign(LEFT, CENTER);
  text(etiqueta, 75, y);

  fill(texto);
  textSize(28);
  textAlign(RIGHT, CENTER);
  text(valor, 625, y);
  textAlign(LEFT, CENTER);
}

// ============================================================
// TECLADO NUMERICO EN PANTALLA
// ============================================================

function construirTeclado() {
  const labels = [["1","2","3"], ["4","5","6"], ["7","8","9"], ["C","0","<"]];
  const xs = [50, 255, 460];
  const ys = [998, 1100, 1202, 1304];
  const w = 190, h = 92;

  teclas = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 3; c++) {
      teclas.push({ label: labels[r][c], x: xs[c], y: ys[r], w: w, h: h });
    }
  }

  botonSiguiente     = new Button(50, 878, 600, 95, "SIGUIENTE", 28);
  botonCerrarTeclado = new Button(550, 706, 100, 86, "\u00d7", 34);
}

function tecladoAbierto() {
  return pantalla === 1 && activeBoxIndex >= 0;
}

function dibujarTeclado() {

  const box = inputs[activeBoxIndex];

  noStroke();
  fill(0, 105);
  rect(0, 0, BASE_W, TEC_Y);

  fill(blanco);
  rect(-20, TEC_Y, BASE_W + 40, 760, 30);

  // Encabezado
  fill(textoSecundario);
  textAlign(LEFT, CENTER);
  textSize(26);
  text(postres[activeBoxIndex], 50, 738);

  fill(box.text === "" ? color('#A5AAA5') : texto);
  textSize(56);
  text(box.text === "" ? "0" : box.text, 50, 818);

  fill(textoSecundario);
  textSize(24);
  textAlign(RIGHT, CENTER);
  text("unidades", 650, 832);
  textAlign(LEFT, CENTER);

  // Cerrar
  noStroke();
  fill(botonCerrarTeclado.isOver(mouseX, mouseY) ? '#E6EAE6' : '#F2F4F2');
  rect(botonCerrarTeclado.x, botonCerrarTeclado.y,
       botonCerrarTeclado.w, botonCerrarTeclado.h, 18);
  fill(textoSecundario);
  textAlign(CENTER, CENTER);
  textSize(34);
  text("\u00d7", botonCerrarTeclado.x + botonCerrarTeclado.w/2,
                 botonCerrarTeclado.y + botonCerrarTeclado.h/2);
  textAlign(LEFT, CENTER);

  // Boton principal
  botonSiguiente.label = (activeBoxIndex < 3) ? "SIGUIENTE \u2192" : "LISTO";
  botonSiguiente.display();

  // Teclas
  for (const t of teclas) {
    noStroke();
    fill(enRect(mouseX, mouseY, t) ? '#E6EAE6' : '#F2F4F2');
    rect(t.x, t.y, t.w, t.h, 18);

    textAlign(CENTER, CENTER);

    if (t.label === "<") {
      fill(textoSecundario);
      textSize(42);
      text("\u2190", t.x + t.w/2, t.y + t.h/2);
    } else if (t.label === "C") {
      fill(textoSecundario);
      textSize(24);
      text("LIMPIAR", t.x + t.w/2, t.y + t.h/2);
    } else {
      fill(texto);
      textSize(40);
      text(t.label, t.x + t.w/2, t.y + t.h/2);
    }

    textAlign(LEFT, CENTER);
  }
}

function enRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

function escribirDigito(d) {
  if (activeBoxIndex < 0) return;
  const box = inputs[activeBoxIndex];
  if (box.text.length < 4) box.text += d;
}

function borrarUltimo() {
  if (activeBoxIndex < 0) return;
  inputs[activeBoxIndex].text = inputs[activeBoxIndex].text.slice(0, -1);
}

function limpiarCampo() {
  if (activeBoxIndex < 0) return;
  inputs[activeBoxIndex].text = "";
}

function siguienteCampo() {
  if (activeBoxIndex < 3) inputs[activeBoxIndex + 1].activate();
  else cerrarTeclado();
}

function pressTeclado(mx, my) {

  if (botonCerrarTeclado.isOver(mx, my)) { cerrarTeclado(); return; }
  if (botonSiguiente.isOver(mx, my))     { siguienteCampo(); return; }

  for (const t of teclas) {
    if (enRect(mx, my, t)) {
      if (t.label === "C") limpiarCampo();
      else if (t.label === "<") borrarUltimo();
      else escribirDigito(t.label);
      return;
    }
  }

  if (my < TEC_Y) cerrarTeclado();
}

// ============================================================
// CALCULOS
// ============================================================

function calcularResultados() {

  totalPostres = 0;
  capitalVendido = 0;
  costoProduccion = 0;
  cantidadMayor = 0;
  postreMasVendido = "-";

  for (let i = 0; i < 4; i++) {

    let valor = inputs[i].getText();
    let parsed = parseInt(valor, 10);

    if (valor === "" || isNaN(parsed) || parsed < 0) parsed = 0;

    unidades[i] = parsed;
    totalPostres += unidades[i];
    capitalVendido += unidades[i] * precios[i];
    costoProduccion += unidades[i] * costos[i];

    if (unidades[i] > cantidadMayor) {
      cantidadMayor = unidades[i];
      postreMasVendido = postres[i];
    }
  }

  // CEO
  profit = capitalVendido - costoProduccion - GASOLINA - LUZ;

  // Repartidor 1
  baseComision = capitalVendido * COMISION_REPARTIDOR;
  pagoRepartidor = baseComision + CUOTA_REPARTIDOR;
  profitRepartidor = capitalVendido - pagoRepartidor - costoProduccion;

  pantalla = (rol === "CEO") ? 2 : 3;
  cerrarTeclado();
}

// ============================================================
// NAVEGACION
// ============================================================

function cerrarTeclado() {
  for (let i = 0; i < 4; i++) inputs[i].active = false;
  activeBoxIndex = -1;
}

function irAPerfil() { pantalla = 0; cerrarTeclado(); }

function irAVentas(nuevoRol) {
  if (nuevoRol) rol = nuevoRol;
  pantalla = 1;
  cerrarTeclado();
}

// ============================================================
// MOUSE / TOUCH
// ============================================================

function mousePressed() { handlePress(mouseX, mouseY); }

function touchStarted() {
  if (touches.length > 0) handlePress(touches[0].x, touches[0].y);
  else handlePress(mouseX, mouseY);
  return false;
}

function handlePress(mx, my) {

  if (tecladoAbierto()) { pressTeclado(mx, my); return; }

  if (pantalla === 0) {

    if (botonCEO.isOver(mx, my)) irAVentas("CEO");
    else if (botonRepartidor.isOver(mx, my)) irAVentas("Repartidor 1");

  } else if (pantalla === 1) {

    if (botonAtras.isOver(mx, my)) { irAPerfil(); return; }

    for (let i = 0; i < 4; i++) inputs[i].pressedAt(mx, my);

    if (botonCalcular.isOver(mx, my)) calcularResultados();

  } else {

    if (botonRegresar.isOver(mx, my)) irAVentas();
  }
}

// ============================================================
// TECLADO FISICO
// ============================================================

function keyPressed() {

  if (pantalla !== 1) return;

  if (tecladoAbierto()) {
    if (key >= '0' && key <= '9') { escribirDigito(key); return false; }
    if (keyCode === BACKSPACE)    { borrarUltimo();      return false; }
    if (keyCode === DELETE)       { limpiarCampo();      return false; }
    if (keyCode === TAB)          { siguienteCampo();    return false; }
    if (keyCode === ESCAPE)       { cerrarTeclado();     return false; }
    if (keyCode === ENTER || keyCode === RETURN) {
      if (activeBoxIndex < 3) siguienteCampo();
      else { cerrarTeclado(); calcularResultados(); }
      return false;
    }
    return false;
  }

  if (keyCode === ENTER || keyCode === RETURN) calcularResultados();
}

// ============================================================
// FORMATO
// ============================================================

function formato(numero) { return nf(numero, 0, 2); }

// ============================================================
// TEXTBOX
// ============================================================

class TextBox {

  constructor(x, y, w, h, index) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.index = index;
    this.text = "";
    this.active = false;
  }

  display() {
    if (this.active) { fill('#F0F6F2'); stroke(verde); strokeWeight(3); }
    else             { fill('#F7F8F7'); stroke(borde); strokeWeight(2); }

    rect(this.x, this.y, this.w, this.h, 18);

    textAlign(CENTER, CENTER);
    textSize(36);

    if (this.text === "") { fill('#A5AAA5'); text("0", this.x + this.w/2, this.y + this.h/2); }
    else                  { fill(texto);     text(this.text, this.x + this.w/2, this.y + this.h/2); }

    textAlign(LEFT, CENTER);
    noStroke();
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }

  pressedAt(mx, my) {
    if (this.isOver(mx, my)) this.activate();
    else if (this.active) this.active = false;
  }

  activate() {
    for (let i = 0; i < inputs.length; i++) inputs[i].active = false;
    this.active = true;
    activeBoxIndex = this.index;
  }

  getText() { return this.text; }
}

// ============================================================
// BUTTON
// ============================================================

class Button {

  constructor(x, y, w, h, label, fontSize) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.fontSize = fontSize || 26;
  }

  display() {
    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 20);
    rect(this.x, this.y + 6, this.w, this.h, 20);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 20);

    fill(blanco);
    textAlign(CENTER, CENTER);
    textSize(this.fontSize);
    text(this.label, this.x + this.w/2, this.y + this.h/2);
    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}

// ============================================================
// BIGBUTTON
// ============================================================

class BigButton {

  constructor(x, y, w, h, label, sublabel) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.sublabel = sublabel;
  }

  display() {
    let hover = this.isOver(mouseX, mouseY);

    noStroke();
    fill(0, 22);
    rect(this.x, this.y + 7, this.w, this.h, 28);

    fill(hover ? verdeHover : verde);
    rect(this.x, this.y, this.w, this.h, 28);

    fill(255, 150);
    textAlign(RIGHT, CENTER);
    textSize(36);
    text("\u2192", this.x + this.w - 42, this.y + this.h/2);

    fill(blanco);
    textAlign(LEFT, CENTER);
    textSize(40);
    text(this.label, this.x + 45, this.y + this.h/2 - 24);

    fill(255, 190);
    textSize(22);
    text(this.sublabel, this.x + 45, this.y + this.h/2 + 30);

    textAlign(LEFT, CENTER);
  }

  isOver(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
}
